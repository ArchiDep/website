---
sections:
  - title: Introduction
    description: >-
      The command line and SSH. Students have met the command line before but
      are not fluent with it, so this section is both a recap and a step
      further: navigating and manipulating files in a Unix shell, getting help,
      editing files with nano, running programs and the `PATH`, then connecting
      to a remote server with SSH and authenticating with a key pair. What
      students must understand of SSH's security is why they check a server's
      key fingerprint on the first connection instead of blindly accepting it.
      The cryptography in the slides (encryption, key exchange, hashes) is
      general background for that point, which students are not expected to
      explain. Vim, shell customization and OpenSSL are optional extras.
      Everything later relies on the shell, and on the SSH key made here.
  - title: Version Control
    description: >-
      Git from the ground up, as a model rather than a list of commands:
      snapshots, the staging area, commits, branches as pointers to commits,
      fast-forward and three-way merges, and conflicts. It then covers remotes
      and collaboration workflows, pushing, fetching and pulling with GitHub
      over SSH, resolving a rejected push, and working as a team on a shared
      repository. It condenses the Pro Git book and stops at what a small team
      needs day to day. Later sections deploy code with Git.
  - title: Security
    description: >-
      A short introduction to web application security: the OWASP Top 10 as the
      list of the most common risks, and a flaw in a deliberately vulnerable
      application (The Image Gallery), which the teacher demonstrates in class
      with a volunteer rather than students doing it on their own. Other
      security concerns come up in demonstrations throughout the course, not as
      a theory of their own.
  - title: Basic Deployment
    description: >-
      Running a server and deploying to it by hand. It introduces cloud
      computing and its service models (IaaS, PaaS, SaaS), then has students
      create a Linux virtual server on Microsoft Azure. It teaches the Unix
      system administration a deployment needs: the file hierarchy, users,
      groups and permissions, `sudo`, processes and signals, standard streams,
      redirection and pipelines, and basic networking (IP addresses, ports, TCP,
      and an HTTP request typed by hand). It ends with a first, deliberately
      naive deployment of a PHP application uploaded with SFTP and run with
      PHP's development server, and a list of its flaws that the next sections
      fix. Linux internals, such as the kernel or scheduling, are out of scope.
  - title: Advanced Deployment
    description: >-
      Fixing the flaws of the basic deployment one by one, on the student's own
      server: deploying with `git clone` and `git pull`, configuring the
      application through environment variables (following the Twelve-Factor
      App), running it as a systemd service, giving it a domain name with DNS
      records, serving it through nginx as a reverse proxy, running PHP with
      PHP-FPM, and adding HTTPS with Let's Encrypt and Certbot. Separate
      applications cover what that one does not: a static site served by nginx,
      a multi-component application behind a reverse proxy, and an application
      scaled horizontally behind a load balancer. Each tool is taught as far as
      the configuration the exercises need: a few systemd options, the common
      DNS record types, the nginx directives used, and TLS certificates as a
      chain of trust rather than as cryptography.
  - title: Automated Deployment
    description: >-
      Deploying with `git push`: Git hooks, and a bare repository on the server
      whose `post-receive` hook checks out the pushed code into the directory
      nginx serves. It adds no new process to the architecture of the previous
      section. The section closes with a graded deployment exercise that reuses
      everything from Basic, Advanced and Automated Deployment.
  - title: Managed Deployment
    description: >-
      Deploying to Platform-as-a-Service providers instead of managing a server:
      GitHub Pages and Netlify for static sites, and Render for a PHP
      application with a PostgreSQL database. It is a contrast with the IaaS
      server of the previous sections: students see which of the things they
      configured by hand (web server, reverse proxy, TLS, domain name,
      deployment on push) the platform now does for them. How a platform works
      inside, such as its build system, is only outlined, and the Docker image
      Render builds is used before Docker is taught.
  - title: Docker Deployment
    description: >-
      Containers with Docker: running and managing containers, images and their
      layers, writing a Dockerfile and building an image, then isolation
      (networks, the container's file system, bind mounts and volumes), and
      Docker Compose to run an application made of a reverse proxy, an
      application server and a database. The exercises containerize applications
      deployed earlier in the course, both locally and on the student's server.
      Publishing images to a registry, Docker Swarm, Compose secrets and
      Kubernetes are out of scope.
cheatsheets:
  - command-line
  - shell-scripting
  - git
  - sysadmin
  - docker
