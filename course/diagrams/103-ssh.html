<template class="diagram-captions"><p data-caption="rest">Your terminal’s shell started the SSH client, which is connected to <code>example.com</code> on port 22. There, the SSH session started a shell, which runs your commands on the server.</p><p data-caption="0">Your computer.</p><p data-caption="1">You open a terminal, which starts a shell: Bash or Zsh.</p><p data-caption="2">You run a command, <code>ls</code> or any other: the shell starts it, and it runs on your computer.</p><p data-caption="3"><code>ls</code> works: it lists the files of the current directory, and prints them to your terminal.</p><p data-caption="4">It has finished, and exits.</p><p data-caption="5">Across the Internet, a server runs an SSH server, waiting for connections on port 22.</p><p data-caption="6">You run <code>ssh jde@example.com</code>: your shell starts the SSH client, which connects to port 22 on <code>example.com</code>.</p><p data-caption="7">The SSH server accepts the connection, and starts a new SSH session to take care of it.</p><p data-caption="8">It hands the connection over to the session, then goes back to waiting for the next one.</p><p data-caption="9">The session starts a shell on the server.</p><p data-caption="10">You type <code>l</code>. Your terminal hands it to the SSH client, which sends it over the connection at once, encrypted. On the server, the session hands it to the shell.</p><p data-caption="11">You type <code>s</code>: it travels the same way.</p><p data-caption="12">You press Enter, which travels too. Once it has arrived, the server’s shell runs <code>ls</code>, on the server.</p><p data-caption="13"><code>ls</code> works, on the server: it lists the files of the current directory there.</p><p data-caption="14">Its output travels back over the connection, against the arrow, and your terminal displays it.</p></template>
