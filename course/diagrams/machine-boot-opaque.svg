<svg xmlns="http://www.w3.org/2000/svg" class="diagram" data-family="machine" viewBox="0 0 1000 600" width="1000" height="600">
  <title>The machine at boot, its processor drawn as a stack of cores, connected by a 64-bit data bus and a 64-bit address bus to a firmware chip, memory, a disk controller with the storage behind it, and device controllers with the devices behind them, which can interrupt the processor</title>
  <style id="diagram-styles">
    svg.diagram[data-family='machine'] .frame { fill: none; stroke: #a3a3a8; stroke-width: 2; stroke-dasharray: 8 6; }
    svg.diagram[data-family='machine'] .box { fill: #ffffff; stroke: #1d1d1f; stroke-width: 3; }
    svg.diagram[data-family='machine'] .label { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
    svg.diagram[data-family='machine'] .small { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    svg.diagram[data-family='machine'] .tiny { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    svg.diagram[data-family='machine'] .label.minor { font-size: 18px; }
    /* The processor's name, in the pill in its corner */
    svg.diagram[data-family='machine'] .label.chip-name { font-size: 18px; fill: #6e6e73; }
    svg.diagram[data-family='machine'] .chip-tab { fill: #f0f0f2; }
    /* What a single wire is labelled with */
    svg.diagram[data-family='machine'] .tiny.signal { font-size: 12px; }
    /* The memory's read and write controls, which a step can light one of */
    svg.diagram[data-family='machine'] .tiny.read-write { font-size: 11px; }
    svg.diagram[data-family='machine'] text.start { text-anchor: start; }
    svg.diagram[data-family='machine'] text.end { text-anchor: end; }
    svg.diagram[data-family='machine'] .data-path { fill: none; stroke: #1971c2; stroke-width: 22; stroke-linejoin: miter; }
    svg.diagram[data-family='machine'] .address-path { fill: none; stroke: #e8590c; stroke-width: 22; stroke-linejoin: miter; }
    svg.diagram[data-family='machine'] .data-bus { fill: #1971c2; }
    svg.diagram[data-family='machine'] .address-bus { fill: #e8590c; }
    svg.diagram[data-family='machine'] .wire { fill: none; stroke: #1d1d1f; stroke-width: 3; }
    svg.diagram[data-family='machine'] .wire.thin { stroke-width: 2; }
    /* The clock's square wave */
    svg.diagram[data-family='machine'] .clock-wave { fill: none; stroke: #1d1d1f; stroke-width: 2.5; }
    /* A wire that goes on somewhere not drawn */
    svg.diagram[data-family='machine'] .wire-dots { fill: none; stroke: #1d1d1f; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 0 7; }
    svg.diagram[data-family='machine'] .bus-label { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    svg.diagram[data-family='machine'] .cell { fill: #ffffff; stroke: #a3a3a8; stroke-width: 1.5; }
    /* A box drawn over what it holds, only its border */
    svg.diagram[data-family='machine'] .box.hollow { fill: none; }
    /* A core of the processor drawn opaque, like the processor's frame */
    svg.diagram[data-family='machine'] .core { fill: #ffffff; stroke: #a3a3a8; stroke-width: 2; }
    /* A file on the storage, or a device behind its controller */
    svg.diagram[data-family='machine'] .file { fill: #f0f0f2; stroke: #a3a3a8; stroke-width: 1.5; }
    /* The part of memory a program is copied into */
    svg.diagram[data-family='machine'] .band { fill: #e5dbff; stroke: #9775fa; stroke-width: 1.5; }
    svg.diagram[data-family='machine'] .band.program { fill: #d3f9d8; stroke: #51cf66; }
    svg.diagram[data-family='machine'] .band-label { font-family: Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1d1d1f; dominant-baseline: middle; }
    /* A connection the control signals open between two components, drawn
       like a live wire in the circuits, its white casing keeping it apart
       from the paths it crosses */
    svg.diagram[data-family='machine'] .live-casing { fill: none; stroke: #ffffff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    svg.diagram[data-family='machine'] .live-wire { fill: none; stroke: #d9480f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    svg.diagram[data-family='machine'] .live-current { fill: none; stroke: #ffd43b; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 11; }
    svg.diagram[data-family='machine'] .bit { fill: #ffffff; stroke: #1d1d1f; stroke-width: 1.5; }
    svg.diagram[data-family='machine'] .step { fill: #ffffff; stroke: #a3a3a8; stroke-width: 1.5; }
    svg.diagram[data-family='machine'] .cell-address { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #6e6e73; text-anchor: end; dominant-baseline: middle; }
    svg.diagram[data-family='machine'] .bits { font-family: Menlo, Consolas, monospace; font-size: 15px; fill: #1d1d1f; dominant-baseline: middle; }
    svg.diagram[data-family='machine'] .bits.unused { fill: #a3a3a8; }
    svg.diagram[data-family='machine'] .annotation { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1971c2; text-anchor: end; dominant-baseline: middle; }
    svg.diagram[data-family='machine'] .marker-data { fill: #1971c2; }
    svg.diagram[data-family='machine'] .marker-address { fill: #e8590c; }
    svg.diagram[data-family='machine'] .marker-wire { fill: #1d1d1f; }

    /* --- What the steps show ------------------------------------------- */

    /* A pill of the cycle, or the cell being read or written, lit like a lamp */
    svg.diagram[data-family='machine'] :is(.cell, .step).lit { fill: #fff3bf; stroke: #f59f00; }
    svg.diagram[data-family='machine'] .cell.lit { stroke-width: 3; }
    svg.diagram[data-family='machine'] .step.lit { stroke-width: 2; }
    /* A control signal the control unit gives, in red */
    svg.diagram[data-family='machine'] .wire.lit { stroke: #e03131; }
    svg.diagram[data-family='machine'] .wire.lit[marker-end] { marker-end: url(#wire-arrow-lit); }
    svg.diagram[data-family='machine'] .marker-wire.lit-marker { fill: #e03131; }
    /* The clock's tick: its wave and its wire in red, flashing as the step
       starts */
    svg.diagram[data-family='machine'] .clock-wave.lit { stroke: #e03131; }
    /* R or W of the memory's controls, in red, the other letters paled, all
       drawn over the controls with a halo hiding them */
    svg.diagram[data-family='machine'] .read-write.lit { fill: #e03131; stroke: #ffffff; stroke-width: 3; stroke-linejoin: round; paint-order: stroke; }
    svg.diagram[data-family='machine'] .read-write.lit .unlit { fill: #c7c7cc; }
    /* A register's value, one binary digit in each of its boxes */
    svg.diagram[data-family='machine'] .bit-value { font-family: Menlo, Consolas, monospace; font-size: 18px; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
    /* What the room says aloud: a register's value in decimal, the decoded
       instruction over the captions it replaces */
    svg.diagram[data-family='machine'] :is(.decimal, .decoded) { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1971c2; text-anchor: middle; dominant-baseline: middle; }
    svg.diagram[data-family='machine'] .decoded { font-family: Menlo, Consolas, monospace; }
    svg.diagram[data-family='machine'] .mask { fill: #ffffff; }

    /* --- Focus --------------------------------------------------------- */

    /* A part the current step is not about is drawn paler, rather than made
       transparent, which would show the paths drawn under the boxes. Values
       stay as they are, the room following them from step to step. */
    svg.diagram[data-family='machine'] :is(.faded.box, .faded .box, .faded .bit) { stroke: #dcdce0; }
    svg.diagram[data-family='machine'] :is(.faded .cell) { stroke: #ebebee; }
    svg.diagram[data-family='machine'] :is(.faded .label, .faded .small, .faded .tiny, .faded .cell-address) { fill: #cfcfd4; }
    svg.diagram[data-family='machine'] :is(.faded .bits) { fill: #8e8e93; }
    svg.diagram[data-family='machine'] :is(.faded.data-path, .faded .data-path) { stroke: #dbe8f7; }
    svg.diagram[data-family='machine'] :is(.faded.address-path, .faded .address-path) { stroke: #fbe5d7; }
    svg.diagram[data-family='machine'] :is(.faded .data-bus) { fill: #dbe8f7; }
    svg.diagram[data-family='machine'] :is(.faded .address-bus) { fill: #fbe5d7; }
    svg.diagram[data-family='machine'] :is(.faded.wire, .faded .wire, .faded .wire-dots, .faded .clock-wave) { stroke: #dcdce0; }
    /* An arrowhead takes its colour from its marker, not from its path */
    svg.diagram[data-family='machine'] :is(.faded.data-path, .faded .data-path)[marker-end] { marker-end: url(#data-arrow-faded); }
    svg.diagram[data-family='machine'] :is(.faded.address-path, .faded .address-path)[marker-end] { marker-end: url(#address-arrow-faded); }
    svg.diagram[data-family='machine'] :is(.faded.wire, .faded .wire)[marker-end] { marker-end: url(#wire-arrow-faded); }
    svg.diagram[data-family='machine'] .marker-data.faded-marker { fill: #dbe8f7; }
    svg.diagram[data-family='machine'] .marker-address.faded-marker { fill: #fbe5d7; }
    svg.diagram[data-family='machine'] .marker-wire.faded-marker { fill: #dcdce0; }

    @media screen and (prefers-reduced-motion: no-preference) {
      /* Current running along a live wire */
      svg.diagram[data-family='machine'] .live-current { animation: machine-current 0.6s linear infinite; }
      svg.diagram[data-family='machine'] .tick.visible { animation: machine-tick 0.36s ease-in-out; }
      /* Focus changes in a moment rather than at once */
      svg.diagram[data-family='machine'] :is([data-faded-at], [data-faded-at] *) { transition: fill 0.18s, stroke 0.18s; }
    }
    @keyframes machine-tick {
      50% { opacity: 0.15; }
    }
    @keyframes machine-current {
      to { stroke-dashoffset: -12; }
    }
  </style>
  <defs id="diagram-defs">
    <!-- Block arrowheads, sized relative to the path's width: a path ending
         in one stops 35 units short of its target. -->
    <marker id="data-arrow" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path class="marker-data" d="M0 0 L8 5 L0 10 z"/>
    </marker>
    <marker id="address-arrow" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path class="marker-address" d="M0 0 L8 5 L0 10 z"/>
    </marker>
    <!-- Thin arrowhead, for a single wire -->
    <marker id="wire-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="marker-wire" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <!-- The same, for a control signal given -->
    <marker id="wire-arrow-lit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="marker-wire lit-marker" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <!-- The same, for a part out of focus -->
    <marker id="data-arrow-faded" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path class="marker-data faded-marker" d="M0 0 L8 5 L0 10 z"/>
    </marker>
    <marker id="address-arrow-faded" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path class="marker-address faded-marker" d="M0 0 L8 5 L0 10 z"/>
    </marker>
    <marker id="wire-arrow-faded" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="marker-wire faded-marker" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <clipPath id="memory-inside"><rect x="380" y="108" width="608" height="283" rx="8"/></clipPath>

  <!-- Paths, drawn under the boxes and buses they connect -->
  <path id="path-cores-address-bus" class="address-path" d="M110 118 H329"/>
  <path id="path-cores-data-bus" class="data-path" d="M110 82 H291"/>
  <!-- The address path reaching left across the data bus, under it -->
  <path id="path-address-bus-device-controllers" class="address-path" d="M329 252 H274" marker-end="url(#address-arrow)"/>
  <path id="path-device-controllers-devices" class="data-path" d="M134 315 V365"/>

  <!-- The processor as a stack of identical cores, the front one titled by a
       pill in its corner, as the processor was -->
  <g id="cores">
    <rect class="core" x="70" y="50" width="130" height="130" rx="16"/>
    <rect class="core" x="60" y="40" width="130" height="130" rx="16"/>
    <rect class="core" x="50" y="30" width="130" height="130" rx="16"/>
    <rect class="core" x="40" y="20" width="130" height="130" rx="16"/>
    <path class="chip-tab" d="M170 116 V134 A16 16 0 0 1 154 150 H66 V132 A16 16 0 0 1 82 116 Z"/>
    <path class="core" fill="none" d="M170 116 H82 A16 16 0 0 0 66 132 V150"/>
    <text class="label chip-name" x="118" y="134">CPU core</text>
  </g>

  <!-- Buses -->
  <path id="path-data-bus-firmware" class="data-path" d="M291 34 H382"/>
  <path id="path-data-bus-memory" class="data-path" d="M291 210 H382"/>
  <path id="path-data-bus-disk-controller" class="data-path" d="M291 465 H382"/>
  <path id="path-data-bus-device-controllers" class="data-path" d="M291 300 H237"/>
  <g id="data-bus">
    <rect class="data-bus" x="280" y="23" width="22" height="453"/>
    <text class="bus-label" x="291" y="330" transform="rotate(-90 291 330)">Data bus · 64 bits</text>
  </g>
  <g id="address-bus">
    <rect class="address-bus" x="318" y="59" width="22" height="379"/>
  </g>
  <path id="path-address-bus-firmware" class="address-path" d="M329 70 H345" marker-end="url(#address-arrow)"/>
  <path id="path-address-bus-memory" class="address-path" d="M329 150 H345" marker-end="url(#address-arrow)"/>
  <path id="path-address-bus-disk-controller" class="address-path" d="M329 427 H345" marker-end="url(#address-arrow)"/>
  <!-- The firmware is only read -->
  <polygon points="377,27 377,41 365,34" fill="#ffffff"/>
  <text class="bus-label" x="329" y="325" transform="rotate(-90 329 325)">Address bus · 64 bits</text>

  <!-- Firmware: where the processor starts, its instructions in ROM -->
  <g id="firmware">
    <rect class="box" x="380" y="20" width="608" height="72" rx="8"/>
    <text class="label" x="470" y="44">Firmware</text>
    <text class="small" x="470" y="70">ROM chip: UEFI</text>
    <rect class="cell" x="574" y="38" width="50" height="14"/><rect class="cell" x="630" y="38" width="50" height="14"/><rect class="cell" x="686" y="38" width="50" height="14"/><rect class="cell" x="742" y="38" width="50" height="14"/><rect class="cell" x="798" y="38" width="50" height="14"/><rect class="cell" x="854" y="38" width="50" height="14"/><rect class="cell" x="910" y="38" width="50" height="14"/>
    <rect class="cell" x="574" y="58" width="50" height="14"/><rect class="cell" x="630" y="58" width="50" height="14"/><rect class="cell" x="686" y="58" width="50" height="14"/><rect class="cell" x="742" y="58" width="50" height="14"/><rect class="cell" x="798" y="58" width="50" height="14"/><rect class="cell" x="854" y="58" width="50" height="14"/><rect class="cell" x="910" y="58" width="50" height="14"/>
  </g>

  <!-- Memory: programs are copied into bands of it, stacked and contiguous,
       filling it from the bottom -->
  <g id="memory">
    <rect class="box" x="380" y="108" width="608" height="283" rx="8"/>
    <text class="label" x="684" y="132">Memory</text>
    <text class="small" x="684" y="156">RAM</text>
  </g>
  <g id="bands" clip-path="url(#memory-inside)">
    <g id="band-init">
      <rect class="band program" x="380" y="311" width="608" height="40"/>
      <text class="band-label" x="396" y="331">init</text>
      <rect class="cell" x="470" y="324" width="50" height="14"/><rect class="cell" x="526" y="324" width="50" height="14"/><rect class="cell" x="582" y="324" width="50" height="14"/>
    </g>
    <g id="band-kernel">
      <rect class="band" x="380" y="351" width="608" height="40"/>
      <text class="band-label" x="396" y="371">kernel</text>
      <rect class="cell" x="470" y="364" width="50" height="14"/><rect class="cell" x="526" y="364" width="50" height="14"/><rect class="cell" x="582" y="364" width="50" height="14"/><rect class="cell" x="638" y="364" width="50" height="14"/><rect class="cell" x="694" y="364" width="50" height="14"/><rect class="cell" x="750" y="364" width="50" height="14"/>
    </g>
  </g>
  <rect class="box hollow" x="380" y="108" width="608" height="283" rx="8"/>

  <!-- Disk controller: on the buses, unlike the storage behind it, which the
       processor cannot address -->
  <path id="path-disk-controller-storage" class="data-path" d="M504 474 V500"/>
  <g id="disk-controller">
    <rect class="box" x="380" y="407" width="248" height="72" rx="8"/>
    <text class="label" x="504" y="443">Disk controller</text>
  </g>

  <!-- Storage: holds the bootloader, the kernel and every other program -->
  <g id="storage">
    <rect class="box" x="380" y="495" width="608" height="91" rx="8"/>
    <text class="label" x="470" y="528">Storage</text>
    <text class="small" x="470" y="554">Disk</text>
    <rect class="file" x="574" y="527" width="96" height="28" rx="4"/><text class="tiny" x="622" y="541">bootloader</text>
    <rect class="file" x="680" y="527" width="70" height="28" rx="4"/><text class="tiny" x="715" y="541">kernel</text>
    <rect class="file" x="760" y="527" width="50" height="28" rx="4"/><text class="tiny" x="785" y="541">init</text>
    <text class="label" x="834" y="537">…</text>
  </g>

  <!-- Device controllers, each a device's registers on the buses, with the
       devices behind them -->
  <g id="device-controllers">
    <rect class="box" x="30" y="230" width="209" height="90" rx="8"/>
    <text class="label" x="134" y="275">Device controllers</text>
  </g>
  <g id="devices">
    <rect class="box" x="30" y="360" width="209" height="226" rx="8"/>
    <text class="label" x="134" y="384">Devices</text>
    <rect class="file" x="50" y="406" width="169" height="44" rx="4"/><text class="small" x="134" y="428">Network</text>
    <rect class="file" x="50" y="460" width="169" height="44" rx="4"/><text class="small" x="134" y="482">Keyboard</text>
    <rect class="file" x="50" y="514" width="169" height="44" rx="4"/><text class="small" x="134" y="536">Graphics card</text>
  </g>

  <!-- The interrupt: a single wire, by which a device tells the processor
       something must be handled -->
  <path id="wire-interrupt" class="wire" d="M45 230 V153" marker-end="url(#wire-arrow)"/>
  <text class="tiny signal start" x="52" y="198">interrupt</text>
</svg>
