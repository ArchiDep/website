<template class="diagram-captions"><p data-caption="rest">In this diagram, systemd, the init process, has started PostgreSQL and then Guess It when the server booted, without anyone logging in. Your browser talks to Guess It, which talks to PostgreSQL.</p><p data-caption="0">Your terminal is connected to your server over SSH. systemd, the init process, started the SSH server and PostgreSQL when the server booted. You have enabled the Guess It service, which is not running yet.</p><p data-caption="1">You run <code>systemctl</code> to start the Guess It service. <code>systemctl</code> does not start Guess It itself: it asks systemd to, through a local socket.</p><p data-caption="2">systemd starts Guess It as the <code>guessit</code> user, with the variables of its configuration file. <code>systemctl</code> exits once Guess It runs.</p><p data-caption="3">You log out and close your terminal: the SSH connection closes, and the processes at both of its ends exit. Guess It keeps running, since systemd started it, not your shell.</p><p data-caption="4">You connect to your server over SSH again.</p><p data-caption="5">You reboot the server with <code>sudo reboot</code>: every process on the server stops, systemd included, and your SSH connection closes.</p><p data-caption="6">The server boots. The kernel starts the first process, the init process with process ID 1, which is systemd on Linux.</p><p data-caption="7">systemd starts the services enabled on boot, such as the SSH server, which is not drawn here, and PostgreSQL, which listens on port 5432.</p><p data-caption="8">systemd starts Guess It, which you enabled, once PostgreSQL has started, as <code>After=postgresql.service</code> in its unit file asks. Guess It listens on port 3000, though nobody has logged in.</p><p data-caption="9">Someone opens a browser on their computer.</p><p data-caption="10">They type your server’s public IP address and port into it. The browser connects to port 3000, where Guess It is listening.</p><p data-caption="11">The browser sends an HTTP request for the home page over the connection, and waits for the answer.</p><p data-caption="12">Guess It works: Node.js runs its JavaScript code, which needs the leaderboard from the database.</p><p data-caption="13">Guess It connects to PostgreSQL on port 5432, with the database URL systemd gave it from its configuration file.</p><p data-caption="14">Guess It sends its query over the connection.</p><p data-caption="15">PostgreSQL works, running the query, while Guess It waits for the answer.</p><p data-caption="16">The rows of the leaderboard travel back to Guess It.</p><p data-caption="17">Guess It works again, building the HTML page from the rows.</p><p data-caption="18">The page travels back over the connection to the browser, with its stylesheets and scripts.</p><p data-caption="19">The browser works, displaying the page.</p></template>
