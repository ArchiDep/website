after the diagram's own look, so that an included diagram needs no stylesheet

A diagram is "fully drawn" when no step is reached: what was drawn in the
file, without what only a step shows. That is the state a page opens with,
the one a deck prints, and the one shown without JavaScript. */
/* --- At rest ------------------------------------------------------------- */
svg.diagram .prompt,

fill: none;
stroke: #fff;
stroke-width: 1.5;
stroke-linecap: round;
stroke-linejoin: round;
}

svg.diagram .overlay:not(.visible) {
display: none;
}
/* Transient: shown from its step until it is torn down, but not when fully
drawn, such as a command that has finished by the end of the story. */
svg.diagram .transient:not(.visible) {
display: none;
}
/* A detail: shown while the diagram is explained, in a page stepping through it
or in a deck, but left out of the fully drawn diagram, at rest and in print,
since students are not expected to draw it. */
svg.diagram .detail {

}

}

animation: diagram-glow 0.8s ease-in-out 3;
}
svg.diagram .process:has(&gt; .pulse.current-fragment) .cog {
display: inline;
animation: diagram-fade-out 0.3s ease-in 2.3s both;
}
svg.diagram .process:has(&gt; .pulse.current-fragment) .cog path {
transform-box: fill-box;
transform-origin: center;
animation: diagram-spin 2.4s cubic-bezier(0.3, 0.5, 0.5, 1) both;
}
svg.diagram .packet.visible .leg:not(.visible) {
animation: diagram-leg-1 0.9s ease-in-out both;
}
svg.diagram .packet.whole.visible .leg:not(.visible) {
animation: diagram-trip 1.8s ease-in-out both;
}
svg.diagram .packet.visible .leg.visible {
animation: diagram-leg-2 1.6s ease-in-out both;
}
/* Heavy data, such as the hundreds of files of node_modules, is slower. */
svg.diagram .packet.heavy.visible .leg:not(.visible) {
animation-duration: 2.7s;
}
svg.diagram .packet.heavy.visible .leg.visible {
animation-duration: 4.8s;
}
svg.diagram .packet.heavy.whole.visible .leg:not(.visible) {
animation-duration: 6s;
}
/* A short-lived process works once started, then exits after a moment to
read it: its box and its edge fade out. No transition into its step:
Firefox would hold the box at the start of the transition, transparent,
while its exit animation waits to begin. */
svg.diagram .process.passing.current-fragment,
svg.diagram .edge.passing.current-fragment {
transition: none;
}
svg.diagram .passing.current-fragment &gt; .glow {
animation: diagram-glow 0.8s ease-in-out var(--work) 3;
}
svg.diagram .passing.current-fragment .cog {
display: inline;
animation: diagram-fade-out 0.3s ease-in calc(var(--work) + 2.3s) both;
}
svg.diagram .passing.current-fragment .cog path {
transform-box: fill-box;
transform-origin: center;
animation: diagram-spin 2.4s cubic-bezier(0.3, 0.5, 0.5, 1) var(--work) both;
}
svg.diagram .process.passing.current-fragment {
animation: diagram-exit 0.8s ease-in calc(var(--work) + 3.9s) forwards;
}
svg.diagram .edge.passing.current-fragment {
animation:
diagram-fade-in 0.4s ease-out var(--delay, 0s) both,
diagram-exit 0.8s ease-in calc(var(--work) + 3.9s) forwards;
}
/* A process starts waiting as its request sets off. */
svg.diagram .clock.visible {
animation: diagram-fade-in 0.4s ease-out 0.2s both;
}
/* Shown once the data that brings it has arrived. */
svg.diagram .arrives.visible {
animation: diagram-fade-in 0.2s ease-out 1.1s both;
}
}
@keyframes diagram-draw {
/* The arrowhead waits for the line to reach it. */
from {
stroke-dashoffset: 1;
marker-end: none;
}
99% {
marker-end: none;
}
to {
stroke-dashoffset: 0;
}
}
@keyframes diagram-leg-1 {
from {
offset-distance: var(--from);
opacity: 0;
}
20% {
opacity: 1;
}
to {
offset-distance: 50%;
opacity: 1;
}
}
/* Delivered: it sits on the box a moment, then fades. */
@keyframes diagram-leg-2 {
from {
offset-distance: 50%;
opacity: 1;
}
55% {
offset-distance: var(--to);
opacity: 1;
}
80% {
opacity: 1;
}
to {
offset-distance: var(--to);
opacity: 0;
}
}
@keyframes diagram-trip {
from {
offset-distance: var(--from);
opacity: 0;
}
10% {
opacity: 1;
}
60% {
offset-distance: var(--to);
opacity: 1;
}
85% {
opacity: 1;
}
to {
offset-distance: var(--to);
opacity: 0;
}
}
@keyframes diagram-cursor-move {
from {
transform: translateX(calc(var(--at, 0) * 1ch));
}
to {
transform: translateX(calc((var(--at, 0) + var(--chars)) * 1ch));
}
}
@keyframes diagram-cursor-blink {
50% {
opacity: 0;
}
}
@keyframes diagram-cursor-off {
to {
visibility: hidden;
}
}
@keyframes diagram-type {
from {
clip-path: inset(0 100% 0 0);
}
to {
clip-path: inset(0);
}
}
@keyframes diagram-box-in {
from {
opacity: 0;
transform: scale(0.8, 0.5);
}
to {
opacity: 1;
transform: none;
}
}
@keyframes diagram-fade-in {
from {
opacity: 0;
}
}
@keyframes diagram-glow {
50% {
opacity: 0.3;
}
}
@keyframes diagram-spin {
to {
transform: rotate(1turn);
}
}
@keyframes diagram-fade-out {
to {
opacity: 0;
}
}
@keyframes diagram-exit {
from {
opacity: 1;
}
to {
opacity: 0;
}
}
/* --- Around the diagram -------------------------------------------------- */
/* Drawn for a white background, in a dark page and on a slide alike. */
.diagram-figure .diagram-canvas {
background: #fff;
border-radius: 8px;
padding: 8px;
}
.diagram-figure svg.diagram {
display: block;
width: 100%;
height: auto;
}
/* A deck hides the legend, the teacher being there to explain, except in
print, which shows the diagram fully drawn. */
.diagram-figure.in-deck:not(.printed) .legend {
display: none;
}
.diagram-figure.in-deck svg.diagram {
max-height: 520px;
}
/* A slide of its own, marked `full-diagram`, makes the figure the whole window
but for the strip of the logos and controls: the card is as large as the
drawing's proportions allow in it, which the deck gives as --diagram-aspect,
since CSS cannot read a view box. The drawing's own margin is the card's
padding. */
section.full-diagram .diagram-figure.in-deck {
container-type: size;
display: flex;
align-items: center;
justify-content: center;
}
section.full-diagram .diagram-figure.in-deck .diagram-canvas {
padding: 0;
width: min(100cqw, 100cqh * var(--diagram-aspect, 2));
}
section.full-diagram .diagram-figure.in-deck svg.diagram {
max-height: none;
}
/* A page stepping through the diagram does what reveal.js does in a deck:
hides the steps not reached yet. The captions say what the legend would. */
.diagram-figure.stepping svg.diagram .fragment {
transition: opacity 0.2s;
}
.diagram-figure.stepping svg.diagram .fragment:not(.visible):not(.leg) {
opacity: 0;
visibility: hidden;
}
.diagram-figure.stepping .legend {
display: none;
}
/* The page's controls, in whatever colours the page is in. */
.diagram-figure .diagram-caption {
margin: 0.5em 0.25em 0;
}
.diagram-figure .diagram-controls {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 0.5em;
margin-top: 0.5em;
}
.diagram-figure .diagram-controls button {
font: inherit;
font-size: 0.9em;
color: inherit;
background: color-mix(in srgb, currentColor 8%, transparent);
border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
border-radius: 6px;
padding: 0.2em 0.75em;
cursor: pointer;
}
.diagram-figure .diagram-controls button:disabled {
opacity: 0.4;
cursor: default;
}
.diagram-figure .diagram-controls button.primary {
background: #1f6feb;
border-color: #1f6feb;
color: #fff;
}
.diagram-figure .diagram-controls .counter {
min-width: 7em;
text-align: center;
font-size: 0.9em;
opacity: 0.7;
}
/* Printed fully drawn, with the caption that goes with it. */
@media print {
.diagram-figure .diagram-controls {
display: none;
}
.diagram-figure .diagram-canvas {
break-inside: avoid;
}
}

<template class="diagram-captions"><p data-caption="rest">Two cores, and two programs in memory, A and B, beside the kernel and init. Each core runs one of the programs, both at the same time: they are parallel.</p><p data-caption="0">A single core, and two programs in memory, A and B, both to run.</p><p data-caption="1">A second core: another complete processor, on the same buses as the first, reading the same memory.</p><p data-caption="2">Each core runs one program: the first core runs program A’s instructions while the second runs program B’s, at the same time. The programs run in parallel.</p><p data-caption="3">Program B ends: the kernel frees its memory.</p><p data-caption="4">Program A runs alone: only the first core works. Program A was not written to use more than one core, so the second core stays idle.</p><p data-caption="5">Program A ends, and the kernel starts program C, which is written to run on several cores at once.</p><p data-caption="6">Program C runs on both cores at the same time: each core runs a different part of program C’s instructions, as two threads of the same program, sharing its memory.</p></template>
