/* Drawn for a white background, in a dark page and on a slide alike. */

}

/* A deck hides the legend, the teacher being there to explain, except in

}

}

but for the strip of the logos and controls: the card is as large as the
drawing's proportions allow in it, which the deck gives as --diagram-aspect,

/* A page stepping through the diagram does what reveal.js does in a deck:

.diagram-figure.stepping svg.diagram .fragment {
transition: opacity 0.2s;
}

<template class="diagram-captions"><p data-caption="rest">In this diagram, your browser talks to the Guess It application running on your server. Guess It talks to the PostgreSQL database server also running on your server. You started Guess It manually in your SSH session, in a shell running on the server.</p><p data-caption="0">Your terminal is still connected to your server over SSH, PostgreSQL is running, and the application’s files are on the server.</p><p data-caption="1">You run <code>sudo -u postgres psql &lt; schema.sql</code>. psql starts and connects to PostgreSQL through its Unix socket, as the <code>postgres</code> user.</p><p data-caption="2">Your shell opened <code>schema.sql</code> and gave its contents to the standard input of psql, which sends the SQL to PostgreSQL, and waits for it to be run.</p><p data-caption="3">PostgreSQL works: it creates the <code>guessit</code> user, its database and its table.</p><p data-caption="4">psql has nothing more to send, and exits.</p><p data-caption="5">You run <code>npm run dev</code>, as on your computer. Your shell starts Guess It, which listens on port 3000.</p><p data-caption="6">You open a browser on your computer.</p><p data-caption="7">You type your server’s public IP address and port into it. It connects to port 3000, where Guess It is listening.</p><p data-caption="8">It sends an HTTP request for the home page over the connection, and waits for the answer.</p><p data-caption="9">Guess It works: Node.js runs its JavaScript code, which needs the leaderboard from the database.</p><p data-caption="10">Guess It connects to PostgreSQL on port 5432, with the database URL you configured.</p><p data-caption="11">It sends its query over the connection.</p><p data-caption="12">PostgreSQL works, running the query, while Guess It waits for the answer.</p><p data-caption="13">The rows of the leaderboard travel back to Guess It.</p><p data-caption="14">Guess It works again, building the HTML page from the rows.</p><p data-caption="15">The page travels back over the connection to your browser, with its stylesheets and scripts.</p><p data-caption="16">Your browser works, displaying the page.</p></template>
