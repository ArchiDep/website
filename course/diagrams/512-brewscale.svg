<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1560 720" width="1560" height="720">
  <title>Three baristas of Brewscale behind nginx as a load balancer</title>
  <style id="diagram-styles">
    svg.diagram { font-family: 'PT Sans', Helvetica, Arial, sans-serif; }
    svg.diagram .lane-heading { font-size: 24px; font-weight: 700; fill: #000; text-anchor: middle; }
    svg.diagram .boundary line { stroke: #000; stroke-width: 5; stroke-dasharray: 14 12; }
    svg.diagram .cloud path { fill: #fff; stroke: #aaa; stroke-width: 2; }
    svg.diagram .cloud text { font-size: 15px; fill: #666; text-anchor: middle; }
    svg.diagram .process rect { fill: #f9505a; stroke: #c93a43; stroke-width: 1; }
    svg.diagram .process text { fill: #fff; text-anchor: middle; }
    svg.diagram .process .label { font-size: 16px; font-weight: 700; }
    svg.diagram .process .subtitle { font-size: 12px; font-style: italic; }
    svg.diagram .process .command { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: 12px; font-weight: 700; }
    svg.diagram .edge path { fill: none; stroke: #000; stroke-width: 1.25; }
    svg.diagram .edge.control path { stroke-dasharray: 3 4; }
    svg.diagram .edge text { font-size: 14px; fill: #000; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 8px; stroke-linejoin: round; }
    svg.diagram .edge text.beside { text-anchor: end; }
    svg.diagram .socket path { fill: none; stroke: #000; stroke-width: 1.5; stroke-linecap: round; }
    svg.diagram .process .socket text, svg.diagram .socket text { font-size: 14px; fill: #000; text-anchor: end; }
    svg.diagram .marker-comm { fill: #000; }
    svg.diagram .marker-control { fill: #fff; stroke: #000; stroke-width: 1.25; }
    svg.diagram .legend .frame { fill: none; stroke: #999; stroke-dasharray: 2 2; }
    svg.diagram .legend .title { font-size: 18px; font-style: italic; text-anchor: middle; }
    svg.diagram .legend .entry { font-size: 12px; text-anchor: end; }
  </style>
  <defs id="diagram-defs">
    <marker id="arrow-comm" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="12" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="marker-comm" d="M0,0 L12,4 L0,8 z"/>
    </marker>
    <marker id="arrow-control" viewBox="-1 -1 14 10" refX="12" refY="4" markerWidth="14" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="marker-control" d="M0,0 L12,4 L0,8 z"/>
    </marker>
  </defs>

  <g id="lane-computer" class="lane"><text class="lane-heading" x="200" y="58">Your Computer</text></g>
  <g id="lane-server" class="lane"><text class="lane-heading" x="1050" y="58">Server</text></g>

  <g id="boundary-internet" class="boundary">
    <line x1="400" y1="48" x2="400" y2="700"/>
    <line x1="540" y1="48" x2="540" y2="700"/>
  </g>

  <g id="cloud-internet" class="cloud">
    <path d="M438,96 a14,14 0 0 1 -2,-28 a20,20 0 0 1 34,-14 a18,18 0 0 1 32,8 a14,14 0 0 1 4,34 z"/>
    <text x="470" y="80">Internet</text>
  </g>

  <g id="node-systemd" class="process">
    <rect x="1380" y="80" width="160" height="46" rx="8"/>
    <text class="label" x="1460" y="100">systemd</text>
    <text class="subtitle" x="1460" y="116">Init process, PID 1</text>
  </g>
  <g id="node-browser" class="process">
    <rect x="160" y="277" width="180" height="46" rx="8"/>
    <text class="label" x="250" y="305">Browser</text>
  </g>
  <g id="node-locust" class="process detail">
    <rect x="160" y="400" width="180" height="90" rx="8"/>
    <text class="label" x="250" y="440">Locust</text>
    <text class="subtitle" x="250" y="456">In a container</text>
  </g>
  <g id="node-nginx" class="process">
    <rect x="600" y="280" width="180" height="110" rx="8"/>
    <text class="label" x="690" y="330">nginx</text>
    <text class="subtitle" x="690" y="346">Load balancer</text>
    <g id="socket-nginx-80" class="socket">
      <path d="M600,292 L582,276 M600,378 L582,394"/>
      <text x="586" y="270">80</text>
    </g>
  </g>
  <g id="node-barista" class="process transient">
    <rect x="1060" y="300" width="280" height="46" rx="8"/>
    <text class="label" x="1200" y="320">Barista</text>
    <text class="command" x="1200" y="336">java -jar target/brewscale.jar</text>
    <g id="socket-barista-4200" class="socket">
      <path d="M1060,316 L1042,300 M1060,330 L1042,346"/>
      <text x="1046" y="294">4200</text>
    </g>
  </g>
  <g id="node-barista-1" class="process">
    <rect x="1060" y="160" width="280" height="46" rx="8"/>
    <text class="label" x="1200" y="180">Barista 1</text>
    <text class="command" x="1200" y="196">java -jar target/brewscale.jar 1</text>
    <g id="socket-barista-1-4201" class="socket">
      <path d="M1060,176 L1042,160 M1060,190 L1042,206"/>
      <text x="1046" y="154">4201</text>
    </g>
  </g>
  <g id="node-barista-2" class="process">
    <rect x="1060" y="300" width="280" height="46" rx="8"/>
    <text class="label" x="1200" y="320">Barista 2</text>
    <text class="command" x="1200" y="336">java -jar target/brewscale.jar 2</text>
    <g id="socket-barista-2-4202" class="socket">
      <path d="M1060,316 L1042,300 M1060,330 L1042,346"/>
      <text x="1046" y="294">4202</text>
    </g>
  </g>
  <g id="node-barista-3" class="process">
    <rect x="1060" y="440" width="280" height="46" rx="8"/>
    <text class="label" x="1200" y="460">Barista 3</text>
    <text class="command" x="1200" y="476">java -jar target/brewscale.jar 3</text>
    <g id="socket-barista-3-4203" class="socket">
      <path d="M1060,456 L1042,440 M1060,470 L1042,486"/>
      <text x="1046" y="434">4203</text>
    </g>
  </g>

  <!-- Edges -->
  <g id="edge-systemd-nginx" class="edge control">
    <path d="M1380,103 H700 Q690,103 690,113 V280" marker-end="url(#arrow-control)"/>
  </g>
  <g id="edge-systemd-barista" class="edge control transient">
    <path d="M1460,126 V313 Q1460,323 1450,323 H1340" marker-end="url(#arrow-control)"/>
  </g>
  <g id="edge-systemd-barista-1" class="edge control">
    <path d="M1460,126 V173 Q1460,183 1450,183 H1340" marker-end="url(#arrow-control)"/>
  </g>
  <g id="edge-systemd-barista-2" class="edge control">
    <path d="M1460,126 V313 Q1460,323 1450,323 H1340" marker-end="url(#arrow-control)"/>
  </g>
  <g id="edge-systemd-barista-3" class="edge control">
    <path d="M1460,126 V453 Q1460,463 1450,463 H1340" marker-end="url(#arrow-control)"/>
  </g>
  <g id="edge-browser-nginx" class="edge comm">
    <path d="M340,300 H600" marker-end="url(#arrow-comm)"/>
    <text x="470" y="289">http://brewscale.jde.archidep2.ch</text>
  </g>
  <g id="edge-locust-nginx-1" class="edge comm detail">
    <path d="M340,415 H440 Q450,415 450,405 V333 Q450,323 460,323 H600" marker-end="url(#arrow-comm)"/>
  </g>
  <g id="edge-locust-nginx-2" class="edge comm detail">
    <path d="M340,445 H480 Q490,445 490,435 V356 Q490,346 500,346 H600" marker-end="url(#arrow-comm)"/>
  </g>
  <g id="edge-locust-nginx-3" class="edge comm detail">
    <path d="M340,475 H520 Q530,475 530,465 V379 Q530,369 540,369 H600" marker-end="url(#arrow-comm)"/>
    <text x="440" y="505">http://brewscale.jde.archidep2.ch</text>
  </g>
  <g id="edge-nginx-barista" class="edge comm transient">
    <path d="M780,323 H1060" marker-end="url(#arrow-comm)"/>
    <text x="945" y="328">http://127.0.0.1:4200</text>
  </g>
  <g id="edge-nginx-barista-1" class="edge comm">
    <path d="M780,323 H810 Q820,323 820,313 V193 Q820,183 830,183 H1060" marker-end="url(#arrow-comm)"/>
    <text x="945" y="188">http://127.0.0.1:4201</text>
  </g>
  <g id="edge-nginx-barista-2" class="edge comm">
    <path d="M780,323 H1060" marker-end="url(#arrow-comm)"/>
    <text x="945" y="328">http://127.0.0.1:4202</text>
  </g>
  <g id="edge-nginx-barista-3" class="edge comm">
    <path d="M780,323 H810 Q820,323 820,333 V453 Q820,463 830,463 H1060" marker-end="url(#arrow-comm)"/>
    <text x="945" y="468">http://127.0.0.1:4203</text>
  </g>
  <g id="legend" class="legend" transform="translate(600,226)">
    <rect class="frame" x="32" y="292" width="308" height="190"/>
    <text class="title" x="186" y="318">Legend</text>
    <g class="process">
      <rect x="94" y="337" width="182" height="31" rx="6"/>
      <text class="label" x="185" y="358">Process</text>
    </g>
    <text class="entry" x="147" y="397">Communication</text>
    <g class="edge comm"><path d="M157,393 H320" marker-end="url(#arrow-comm)"/></g>
    <text class="entry" x="147" y="419">Control</text>
    <g class="edge control"><path d="M157,415 H320" marker-end="url(#arrow-control)"/></g>
    <text class="entry" x="147" y="441">Network Boundary</text>
    <g class="boundary"><line x1="157" y1="437" x2="322" y2="437"/></g>
    <text class="entry" x="147" y="465">Listening Port</text>
    <g class="process"><rect x="304" y="452" width="22" height="18" rx="3"/></g>
    <g class="socket"><path d="M304,457 L291,448 M304,465 L291,474"/></g>
  </g>
</svg>
