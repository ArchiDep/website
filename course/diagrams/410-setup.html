<template class="diagram-captions"><p data-caption="rest">PostgreSQL is installed and running on your server, listening on port 5432. Node.js is installed, but nothing of it runs.</p><p data-caption="0">You start the exercise by connecting to your server over SSH. This diagram shows that connection already open. The following steps show what happens when you type commands on the server.</p><p data-caption="1">You run <code>sudo apt install postgresql</code>. APT downloads PostgreSQL, installs it, and exits.</p><p data-caption="2">Installing PostgreSQL also started it. It listens on port 5432, and on a Unix socket, a file through which programs on the same server can connect to it. Something started it automatically: more on that later in the course.</p><p data-caption="3">You install Node.js: you install <code>curl</code>, download and run NodeSource’s setup script with it, which adds their repository, then run <code>sudo apt-get install -y nodejs</code>. APT installs it, and exits. Nothing new stays running: installing a program only puts its files on the disk.</p><p data-caption="4">You run <code>node -v</code>. Installed, Node.js is only files on the disk: it runs only when you start it, and here, it stops as soon as it has printed its version.</p></template>
