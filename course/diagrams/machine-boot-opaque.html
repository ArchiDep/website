animation:
diagram-fade-in 0.4s ease-out var(--delay, 0s) both,
diagram-exit 0.8s ease-in calc(var(--work) + 3.9s) forwards;
}
/* A process starts waiting as its request sets off. */
svg.diagram .clock.visible {
animation: diagram-fade-in 0.4s ease-out 0.2s both;
}
/* Shown once the data that brings it has arrived. */
svg.diagram .arrives.visible {
animation: diagram-fade-in 0.2s ease-out 1.1s both;
}
}
@keyframes diagram-draw {
/* The arrowhead waits for the line to reach it. */
from {
stroke-dashoffset: 1;
marker-end: none;
}
99% {
marker-end: none;
}
to {
stroke-dashoffset: 0;
}
}
@keyframes diagram-leg-1 {
from {
offset-distance: var(--from);
opacity: 0;
}
20% {
opacity: 1;
}
to {
offset-distance: 50%;
opacity: 1;
}
}
/* Delivered: it sits on the box a moment, then fades. */
@keyframes diagram-leg-2 {
from {
offset-distance: 50%;
opacity: 1;
}
55% {
offset-distance: var(--to);
opacity: 1;
}
80% {
opacity: 1;
}
to {
offset-distance: var(--to);
opacity: 0;
}
}
@keyframes diagram-trip {
from {
offset-distance: var(--from);
opacity: 0;
}
10% {
opacity: 1;
}
60% {
offset-distance: var(--to);
opacity: 1;
}
85% {
opacity: 1;
}
to {

opacity: 0;
}
}

from {

}

}

}
}

@keyframes diagram-box-in {

}

}
/* --- Around the diagram -------------------------------------------------- */
/* Drawn for a white background, in a dark page and on a slide alike. */
.diagram-figure .diagram-canvas {
background: #fff;
border-radius: 8px;
padding: 8px;
}
.diagram-figure svg.diagram {
display: block;
width: 100%;
height: auto;
}
/* A deck hides the legend, the teacher being there to explain, except in
print, which shows the diagram fully drawn. */
.diagram-figure.in-deck:not(.printed) .legend {
display: none;
}
.diagram-figure.in-deck svg.diagram {
max-height: 520px;
}
/* A slide of its own, marked `full-diagram`, makes the figure the whole window
but for the strip of the logos and controls: the card is as large as the
drawing's proportions allow in it, which the deck gives as --diagram-aspect,
since CSS cannot read a view box. The drawing's own margin is the card's
padding. */
section.full-diagram .diagram-figure.in-deck {
container-type: size;
display: flex;
align-items: center;
justify-content: center;
}
section.full-diagram .diagram-figure.in-deck .diagram-canvas {
padding: 0;
width: min(100cqw, 100cqh * var(--diagram-aspect, 2));
}
section.full-diagram .diagram-figure.in-deck svg.diagram {
max-height: none;
}
/* A page stepping through the diagram does what reveal.js does in a deck:
hides the steps not reached yet. The captions say what the legend would. */
.diagram-figure.stepping svg.diagram .fragment {
transition: opacity 0.2s;
}
.diagram-figure.stepping svg.diagram .fragment:not(.visible):not(.leg) {
opacity: 0;
visibility: hidden;
}
.diagram-figure.stepping .legend {
display: none;
}
/* The page's controls, in whatever colours the page is in. */
.diagram-figure .diagram-caption {
margin: 0.5em 0.25em 0;
}
.diagram-figure .diagram-controls {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 0.5em;
margin-top: 0.5em;
}
.diagram-figure .diagram-controls button {
font: inherit;
font-size: 0.9em;
color: inherit;
background: color-mix(in srgb, currentColor 8%, transparent);
border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
border-radius: 6px;
padding: 0.2em 0.75em;
cursor: pointer;
}
.diagram-figure .diagram-controls button:disabled {
opacity: 0.4;
cursor: default;
}
.diagram-figure .diagram-controls button.primary {
background: #1f6feb;
border-color: #1f6feb;
color: #fff;
}
.diagram-figure .diagram-controls .counter {
min-width: 7em;
text-align: center;
font-size: 0.9em;
opacity: 0.7;
}
/* Printed fully drawn, with the caption that goes with it. */
@media print {
.diagram-figure .diagram-controls {
display: none;
}
.diagram-figure .diagram-canvas {
break-inside: avoid;
}
}

<template class="diagram-captions"><p data-caption="rest">The processor drawn as a stack of cores, connected by the buses to the firmware, the memory, the disk controller and the device controllers. The storage and the devices are behind their controllers, and a device can interrupt the processor. Once booted, the memory holds the kernel and init.</p><p data-caption="0">The machine is powered on. There is no program or data in memory yet.</p><p data-caption="1">The processor starts at an address that leads to the firmware, and runs its instructions one after the other.</p><p data-caption="2">The firmware asks the disk controller to copy the bootloader from the storage into memory, by writing to the controller’s registers.</p><p data-caption="3">The disk controller copies the bootloader into memory over the buses, giving the addresses to write at itself, without the processor.</p><p data-caption="4">The processor jumps to the bootloader’s first instruction, in memory: it now runs the bootloader.</p><p data-caption="5">The bootloader runs, its instructions fetched from memory one after the other.</p><p data-caption="6">The bootloader asks the disk controller to copy the kernel from the storage into memory.</p><p data-caption="7">The disk controller copies the kernel into memory, while the bootloader waits for the copy to be done.</p><p data-caption="8">The processor jumps to the kernel’s first instruction: it now runs the kernel, the core of the operating system.</p><p data-caption="9">The kernel runs, and prepares the machine: the devices, the memory, the other cores, the files on the storage.</p><p data-caption="10">The kernel frees the memory the bootloader was copied into: the bootloader is no longer needed.</p><p data-caption="11">The kernel asks the disk controller to copy init, the first program it starts, from the storage into memory.</p><p data-caption="12">While the disk controller copies init, the processor has nothing to run: the kernel stops it until the copy is done.</p><p data-caption="13">Once done, the disk controller interrupts the processor, which jumps to the kernel’s code that handles it, wherever it was.</p><p data-caption="14">The kernel jumps to init’s first instruction: the processor now runs init.</p><p data-caption="15">Init runs, its instructions fetched from memory one after the other.</p></template>
