<path d="M-27,-12 H17 L27,0 L17,12 H-27 Z"/><text x="-5" y="5">POST</text></g></g><g class="overlay packet fragment whole" data-fragment-index="40"><g class="leg" style="offset-path: path('M780,323 H810 Q820,323 820,313 V193 Q820,183 830,183 H1060'); --from: 0%; --to: 100%"><path d="M-59,-12 H49 L59,0 L49,12 H-59 Z"/><text x="-5" y="5">POST /orders</text></g></g><g class="overlay packet fragment whole" data-fragment-index="40"><g class="leg" style="offset-path: path('M780,323 H1060'); --from: 0%; --to: 100%"><path d="M-59,-12 H49 L59,0 L49,12 H-59 Z"/><text x="-5" y="5">POST /orders</text></g></g><g class="overlay packet fragment whole" data-fragment-index="40"><g class="leg" style="offset-path: path('M780,323 H810 Q820,323 820,333 V453 Q820,463 830,463 H1060'); --from: 0%; --to: 100%"><path d="M-59,-12 H49 L59,0 L49,12 H-59 Z"/><text x="-5" y="5">POST /orders</text></g></g><g class="overlay packet fragment whole" data-fragment-index="42"><g class="leg" style="offset-path: path('M780,323 H810 Q820,323 820,313 V193 Q820,183 830,183 H1060'); --from: 100%; --to: 0%"><path d="M-27,-12 H17 L27,0 L17,12 H-27 Z" transform="scale(-1,1)"/><text x="5" y="5">HTML</text></g></g><g class="overlay packet fragment whole" data-fragment-index="42"><g class="leg" style="offset-path: path('M780,323 H1060'); --from: 100%; --to: 0%"><path d="M-27,-12 H17 L27,0 L17,12 H-27 Z" transform="scale(-1,1)"/><text x="5" y="5">HTML</text></g></g><g class="overlay packet fragment whole" data-fragment-index="42"><g class="leg" style="offset-path: path('M780,323 H810 Q820,323 820,333 V453 Q820,463 830,463 H1060'); --from: 100%; --to: 0%"><path d="M-27,-12 H17 L27,0 L17,12 H-27 Z" transform="scale(-1,1)"/><text x="5" y="5">HTML</text></g></g><g class="overlay packet fragment whole" data-fragment-index="43"><g class="leg" style="offset-path: path('M340,415 H440 Q450,415 450,405 V333 Q450,323 460,323 H600'); --from: 100%; --to: 0%"><path d="M-27,-12 H17 L27,0 L17,12 H-27 Z" transform="scale(-1,1)"/><text x="5" y="5">HTML</text></g></g><g class="overlay packet fragment whole" data-fragment-index="43"><g class="leg" style="offset-path: path('M340,445 H480 Q490,445 490,435 V356 Q490,346 500,346 H600'); --from: 100%; --to: 0%"><path d="M-27,-12 H17 L27,0 L17,12 H-27 Z" transform="scale(-1,1)"/><text x="5" y="5">HTML</text></g></g><g class="overlay packet fragment whole" data-fragment-index="43"><g class="leg" style="offset-path: path('M340,475 H520 Q530,475 530,465 V379 Q530,369 540,369 H600'); --from: 100%; --to: 0%"><path d="M-27,-12 H17 L27,0 L17,12 H-27 Z" transform="scale(-1,1)"/><text x="5" y="5">HTML</text></g></g></svg>

<template class="diagram-captions"><p data-caption="rest">In this diagram, three baristas of Brewscale, three processes running the same jar, listen on ports 4201 to 4203. nginx listens on port 80, and balances the orders of the café among them. systemd, the init process, started all of them when the server booted.</p><p data-caption="0">systemd, the init process, started nginx when the server booted. nginx listens on port 80. Your wildcard DNS record, <code>*.jde</code>, points <code>brewscale.jde.archidep2.ch</code> to your server’s public IP address.</p><p data-caption="1">You start the Brewscale service: systemd starts one barista, as the <code>brewscale</code> user. The barista listens on port 4200.</p><p data-caption="2">Someone opens a browser on their computer.</p><p data-caption="3">They type the café’s address into the browser. The browser looks up <code>brewscale.jde.archidep2.ch</code> in the DNS, which answers with your server’s public IP address.</p><p data-caption="4">The browser connects to port 80, the default port of HTTP, at your server’s public IP address, where nginx listens.</p><p data-caption="5">The browser sends an order for a flat white over the connection, and waits for the answer.</p><p data-caption="6">nginx works: the configuration of <code>brewscale.jde.archidep2.ch</code> proxies the request to <code>http://127.0.0.1:4200</code>, where the barista listens.</p><p data-caption="7">nginx connects to the barista on port 4200, at <code>127.0.0.1</code>, the server’s own loopback address.</p><p data-caption="8">nginx sends the order on to the barista, and waits for the answer.</p><p data-caption="9">The barista brews the flat white: it waits for a second, without using the CPU, as an application waits for a database or another service.</p><p data-caption="10">The barista works, building the page that hands over the flat white.</p><p data-caption="11">The page travels back to nginx, over the connection nginx opened.</p><p data-caption="12">nginx sends the page on to the browser. The flat white took about a second.</p><p data-caption="13">You run Locust in a container on your computer, and start a load test with three customers in its web interface.</p><p data-caption="14">Each customer of Locust connects to the café by its name, as any customer would: to port 80 at your server’s public IP address, where nginx listens.</p><p data-caption="15">The three customers send their orders at the same time, each over its own connection, and wait for the answers.</p><p data-caption="16">nginx sends the first order on to the barista.</p><p data-caption="17">The barista brews the first order, for a second. It serves one customer at a time: the other two orders wait in the queue.</p><p data-caption="18">The page of the first order travels back to nginx.</p><p data-caption="19">nginx sends the page on to the first customer, and the second order on to the barista.</p><p data-caption="20">The barista brews the second order. The third still waits in the queue.</p><p data-caption="21">The page of the second order travels back to nginx.</p><p data-caption="22">nginx sends the page on to the second customer, and the third order on to the barista.</p><p data-caption="23">The barista brews the third order, whose customer has already waited two seconds.</p><p data-caption="24">The page of the third order travels back to nginx.</p><p data-caption="25">nginx sends the page on to the third customer, who waited three seconds for a coffee that took one second to brew.</p><p data-caption="26">You stop the Brewscale service: the barista exits.</p><p data-caption="27">You start <code>brewscale.target</code>: systemd starts three baristas from the template <code>brewscale@.service</code>, each with its own number, and listening on port 420 followed by that number.</p><p data-caption="28">You reload the café’s page in the browser. The browser asks nginx for the order form, over the same connection.</p><p data-caption="29">nginx now proxies the café’s requests to its upstream, which lists the three baristas, and takes them in turn. It is the turn of barista 1: nginx connects to it on port 4201, and forwards the request.</p><p data-caption="30">Barista 1 builds the order form at once, with nothing to brew, and sends it back to nginx.</p><p data-caption="31">nginx sends the page on to the browser, which shows the café in the colour of barista 1.</p><p data-caption="32">You reload the page once more.</p><p data-caption="33">It is the turn of barista 2: nginx connects to it on port 4202, and forwards the request.</p><p data-caption="34">Barista 2 builds the order form at once, with nothing to brew, and sends it back to nginx.</p><p data-caption="35">nginx sends the page on to the browser, which shows the café in the colour of barista 2.</p><p data-caption="36">You reload the page once more.</p><p data-caption="37">It is the turn of barista 3: nginx connects to it on port 4203, and forwards the request.</p><p data-caption="38">Barista 3 builds the order form at once, with nothing to brew, and sends it back to nginx.</p><p data-caption="39">nginx sends the page on to the browser, which shows the café in the colour of barista 3.</p><p data-caption="40">The three customers of Locust send their orders at the same time again.</p><p data-caption="41">nginx gives one order to each barista, in turn: barista 1, barista 2, then barista 3.</p><p data-caption="42">The three baristas brew at the same time, each waiting for a second. Waiting uses no CPU, so the processor is free for all three.</p><p data-caption="43">The three pages travel back to nginx: three orders served in about the time one barista takes for one.</p><p data-caption="44">nginx sends the pages on to the three customers, who each waited about a second.</p></template>
