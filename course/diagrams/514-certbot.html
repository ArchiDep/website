<template class="diagram-captions"><p data-caption="rest">In this diagram, a browser reaches Guess It over HTTPS, at <code>https://guessit.jde.archidep2.ch</code>. nginx listens on port 443, holds the certificate and its private key, and decrypts the request before forwarding it to Guess It on port 3000 over plain HTTP. systemd, the init process, started all three when the server booted.</p><p data-caption="0">systemd, the init process, started PostgreSQL, Guess It and nginx when the server booted. nginx listens on port 443 for HTTPS, and on port 80 to redirect to HTTPS. Guess It listens on port 3000.</p><p data-caption="1">Someone opens a browser on their computer.</p><p data-caption="2">They type Guess It’s address into the browser, starting with <code>https://</code>. The browser looks up <code>guessit.jde.archidep2.ch</code> in the DNS, which answers with your server’s public IP address.</p><p data-caption="3">The browser connects to port 443, the default port of HTTPS, where nginx listens. nginx sends its certificate, which the browser checks, and they agree on a key to encrypt the connection.</p><p data-caption="4">The browser sends an HTTP request for the home page over the connection, encrypted, and waits for the answer. Nobody between your computer and the server can read it.</p><p data-caption="5">nginx works: it decrypts the request, and picks the configuration whose <code>server_name</code> is the name in the <code>Host</code> header. That configuration says to proxy the request to <code>http://127.0.0.1:3000</code>, as before.</p><p data-caption="6">nginx connects to Guess It on port 3000, at <code>127.0.0.1</code>, the server’s own loopback address. This connection is not encrypted, but it never leaves the server.</p><p data-caption="7">nginx sends the request on to Guess It, in plain HTTP, and waits for the answer. Guess It does not know that the browser used HTTPS.</p><p data-caption="8">Guess It works: Node.js runs its JavaScript code, which needs the leaderboard from the database.</p><p data-caption="9">Guess It connects to PostgreSQL on port 5432, with the database URL systemd gave it from its configuration file.</p><p data-caption="10">Guess It sends its query over the connection.</p><p data-caption="11">PostgreSQL works, running the query, while Guess It waits for the answer.</p><p data-caption="12">The rows of the leaderboard travel back to Guess It.</p><p data-caption="13">Guess It works again, building the HTML page from the rows.</p><p data-caption="14">The page travels back to nginx, in plain HTTP, over the connection nginx opened.</p><p data-caption="15">nginx encrypts the page and sends it on to the browser, over the browser’s connection.</p><p data-caption="16">The browser works, decrypting and displaying the page.</p></template>
