diagram-exit 0.8s ease-in calc(var(--work) + 3.9s) forwards;
}
/* A process starts waiting as its request sets off. */
svg.diagram .clock.visible {
animation: diagram-fade-in 0.4s ease-out 0.2s both;
}
/* Shown once the data that brings it has arrived. */
svg.diagram .arrives.visible {
animation: diagram-fade-in 0.2s ease-out 1.1s both;
}
}
@keyframes diagram-draw {
/* The arrowhead waits for the line to reach it. */
from {
stroke-dashoffset: 1;
marker-end: none;
}
99% {
marker-end: none;
}
to {
stroke-dashoffset: 0;
}
}
@keyframes diagram-leg-1 {
from {
offset-distance: var(--from);
opacity: 0;
}
20% {
opacity: 1;
}

opacity: 1;
}
}
/* Delivered: it sits on the box a moment, then fades. */

opacity: 1;
}
55% {

opacity: 1;
}
80% {

}

opacity: 0;
}
}

offset-distance: var(--from);
opacity: 0;
}
10% {

/* --- Around the diagram -------------------------------------------------- */
/* Drawn for a white background, in a dark page and on a slide alike. */
.diagram-figure .diagram-canvas {
background: #fff;
border-radius: 8px;
padding: 8px;
}
.diagram-figure svg.diagram {
display: block;
width: 100%;
height: auto;
}
/* A deck hides the legend, the teacher being there to explain, except in
print, which shows the diagram fully drawn. */
.diagram-figure.in-deck:not(.printed) .legend {
display: none;
}
.diagram-figure.in-deck svg.diagram {
max-height: 520px;
}
/* A slide of its own, marked `full-diagram`, makes the figure the whole window
but for the strip of the logos and controls: the card is as large as the
drawing's proportions allow in it, which the deck gives as --diagram-aspect,
since CSS cannot read a view box. The drawing's own margin is the card's
padding. */
section.full-diagram .diagram-figure.in-deck {
container-type: size;
display: flex;
align-items: center;
justify-content: center;
}
section.full-diagram .diagram-figure.in-deck .diagram-canvas {
padding: 0;
width: min(100cqw, 100cqh * var(--diagram-aspect, 2));
}
section.full-diagram .diagram-figure.in-deck svg.diagram {
max-height: none;
}
/* A page stepping through the diagram does what reveal.js does in a deck:
hides the steps not reached yet. The captions say what the legend would. */
.diagram-figure.stepping svg.diagram .fragment {
transition: opacity 0.2s;
}
.diagram-figure.stepping svg.diagram .fragment:not(.visible):not(.leg) {
opacity: 0;
visibility: hidden;
}
.diagram-figure.stepping .legend {
display: none;
}
/* The page's controls, in whatever colours the page is in. */
.diagram-figure .diagram-caption {
margin: 0.5em 0.25em 0;
}
.diagram-figure .diagram-controls {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 0.5em;
margin-top: 0.5em;
}
.diagram-figure .diagram-controls button {
font: inherit;
font-size: 0.9em;
color: inherit;
background: color-mix(in srgb, currentColor 8%, transparent);
border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
border-radius: 6px;
padding: 0.2em 0.75em;
cursor: pointer;
}
.diagram-figure .diagram-controls button:disabled {
opacity: 0.4;
cursor: default;
}
.diagram-figure .diagram-controls button.primary {
background: #1f6feb;
border-color: #1f6feb;
color: #fff;
}
.diagram-figure .diagram-controls .counter {
min-width: 7em;
text-align: center;
font-size: 0.9em;
opacity: 0.7;
}
/* Printed fully drawn, with the caption that goes with it. */
@media print {
.diagram-figure .diagram-controls {
display: none;
}
.diagram-figure .diagram-canvas {
break-inside: avoid;
}
}

<template class="diagram-captions"><p data-caption="rest">A 64-bit processor, connected by data and address buses to the firmware, the memory and the disk controller. The storage is behind the disk controller, which the processor asks to copy from it into memory.</p><p data-caption="0">A modern computer, drawn like the toy machine. The machine is powered on, and there is no program in memory yet.</p><p data-caption="1">4.5 GHz: the clock ticks 4.5 billion times a second.</p><p data-caption="2">64-bit: the registers hold 64 bits each, and the buses carry 64 bits at once, of data or of an address.</p><p data-caption="3">32 MB of L3 cache: the largest of the processor’s caches, which keep copies of recently used memory. L1 and L2 belong to a core, and L3 is shared by all of them.</p><p data-caption="4">The whole processor again.</p><p data-caption="5">From now on, the processor is drawn as a box: what is inside it is no longer shown.</p><p data-caption="6">The processor is drawn smaller: what follows happens outside it.</p><p data-caption="7">It is one core of the processor, which has several, each following a program of its own.</p><p data-caption="8">The firmware, the memory and the storage take the room the processor leaves.</p><p data-caption="9">Everything else is a device behind a controller on the buses, which can interrupt the processor when something must be handled.</p><p data-caption="10">4 cores: four processors in one chip, each following a program of its own at the same time, sharing the buses and the memory.</p><p data-caption="11">32 GB of RAM, in two sticks of 16 GB: still one memory, of about 32 billion cells, its addresses running on from one stick to the other. DDR5 6000 MHz: up to 6000 million transfers a second, which says nothing of how long a value takes to arrive.</p><p data-caption="12">UEFI: the firmware, which the processor runs first at power-on, from a chip that is only read.</p><p data-caption="13">A 2 TB NVMe SSD: the storage, where programs and files stay with the power off, its controller on the drive itself. PCIe 4.0 connects the disk controller to the rest, and up to 7450 MB/s is how fast it copies from the storage into memory.</p><p data-caption="14">B650: the motherboard, which everything plugs into, and which carries the buses between the parts.</p><p data-caption="15">A graphics card, Wi-Fi and Ethernet: devices, each behind a controller whose registers the processor reaches at addresses of their own.</p><p data-caption="16">The whole machine again, ready to boot.</p></template>
