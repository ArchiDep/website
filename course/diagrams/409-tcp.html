<template class="diagram-captions"><p data-caption="rest">Alice’s netcat is connected to Bob’s, which listens on port 3000. The arrow shows who opened the connection: Alice.</p><p data-caption="0">Two servers, separated by the Internet. Alice and Bob are each connected to their server over SSH, as in the first session; the diagram leaves that out to focus on the connection between the two netcats.</p><p data-caption="1">Bob runs <code>nc -l 3000</code>. His netcat starts and listens on port 3000, waiting for a connection.</p><p data-caption="2">Alice runs <code>nc W.X.Y.Z 3000</code>. Her netcat connects to port 3000 on Bob’s server. The arrow starts from the one who connected.</p><p data-caption="3">Bob types <code>Hello</code> and presses Enter. His netcat sends it over the connection…</p><p data-caption="4">…and Alice’s netcat prints it in her terminal. The data travelled against the arrow: once connected, either side can send.</p><p data-caption="5">Alice types <code>World</code> and presses Enter…</p><p data-caption="6">…and Bob’s netcat prints it. One connection, data in both directions.</p></template>
