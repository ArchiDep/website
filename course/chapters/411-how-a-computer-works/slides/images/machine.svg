<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="The machine: a processor with a clock, a program counter, a control unit, an ALU and an accumulator, connected to a memory of 16 cells by a data bus and an address bus">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f" />
    </marker>
  </defs>

  <style>
    .frame { fill: none; stroke: #a3a3a8; stroke-width: 2; stroke-dasharray: 8 6; }
    .box { fill: #ffffff; stroke: #1d1d1f; stroke-width: 3; }
    .label { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    .link { fill: none; stroke: #1d1d1f; stroke-width: 3; }
    .data { fill: #1971c2; }
    .address { fill: #e8590c; }
    .bus-label { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .cell { fill: #ffffff; stroke: #a3a3a8; stroke-width: 1.5; }
    .cell-address { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #6e6e73; text-anchor: end; dominant-baseline: middle; }
    .value { font-family: Menlo, Consolas, monospace; font-size: 17px; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- The processor -->
  <rect class="frame" x="10" y="10" width="590" height="580" rx="16" />
  <text class="small" x="62" y="32">Processor</text>

  <!-- Buses. Drawing order makes each bus pass behind the other where they
       cross: the selector's address link, then the data bus, then the rest of
       the address bus. -->
  <rect id="address-bus-selector" class="address" x="560" y="56" width="110" height="24" />
  <g id="data-bus">
    <rect class="data" x="616" y="20" width="28" height="568" />
    <rect class="data" x="30" y="460" width="614" height="28" />
    <text class="bus-label" x="300" y="475">Data bus</text>
  </g>
  <rect id="data-bus-memory" class="data" x="644" y="460" width="76" height="28" />
  <g id="address-bus">
    <rect class="address" x="668" y="20" width="24" height="568" />
    <text class="bus-label" x="680" y="300" transform="rotate(-90 680 300)">Address bus</text>
  </g>
  <rect id="address-bus-memory" class="address" x="692" y="56" width="28" height="24" />

  <!-- Selector: chooses which address goes on the address bus -->
  <g id="selector">
    <polygon class="box" points="500,40 560,56 560,80 500,96" />
    <text class="small" x="530" y="26">Selector</text>
  </g>

  <!-- Program counter -->
  <g id="program-counter">
    <rect class="box" x="40" y="120" width="160" height="80" rx="8" />
    <text class="label" x="120" y="148">Program</text>
    <text class="label" x="120" y="174">counter</text>
  </g>

  <!-- Control unit, holding the instruction register -->
  <g id="control-unit">
    <rect class="box" x="240" y="120" width="320" height="180" rx="8" />
    <text class="label" x="360" y="155">Control unit</text>
  </g>
  <g id="instruction-register">
    <rect class="box" x="270" y="200" width="220" height="70" rx="6" />
    <text class="small" x="380" y="235">Instruction register</text>
  </g>

  <!-- Accumulator and ALU -->
  <g id="accumulator">
    <rect class="box" x="330" y="340" width="120" height="80" rx="8" />
    <text class="label" x="390" y="380">Acc.</text>
  </g>
  <g id="alu">
    <rect class="box" x="480" y="340" width="110" height="80" rx="8" />
    <text class="label" x="535" y="380">ALU</text>
  </g>

  <!-- Clock: drives every component, which is narrated rather than drawn -->
  <g id="clock">
    <rect class="box" x="40" y="505" width="160" height="70" rx="8" />
    <text class="label" x="120" y="527">Clock</text>
    <path d="M64 563 H82 V543 H104 V563 H126 V543 H148 V563 H170 V543 H180" fill="none" stroke="#1d1d1f" stroke-width="2.5" />
  </g>

  <!-- Links between the components and the buses, drawn over the boxes so that
       the instruction register's can be seen leaving the control unit -->
  <path id="link-pc-selector" class="link" d="M120 120 V56 H497" marker-end="url(#arrow)" />
  <path id="link-ir-selector" class="link" d="M460 200 V84 H497" marker-end="url(#arrow)" />
  <path id="link-pc-bus" class="link" d="M120 200 V460" />
  <path id="link-ir-bus" class="link" d="M300 270 V460" />
  <path id="link-acc-bus" class="link" d="M390 420 V460" />
  <path id="link-bus-alu" class="link" d="M535 460 V423" marker-end="url(#arrow)" />
  <path id="link-acc-alu" class="link" d="M450 365 H477" marker-end="url(#arrow)" />
  <path id="link-alu-acc" class="link" d="M480 395 H453" marker-end="url(#arrow)" />
  <path id="link-alu-zero" class="link" d="M510 340 V303" marker-end="url(#arrow)" />
  <text class="small" x="540" y="322">zero</text>

  <!-- Memory: the program of the trace, then its data -->
  <!-- TODO: show the instructions as binary once the encodings are decided;
       only LOAD = 0001 is fixed so far. -->
  <g id="memory">
    <rect class="box" x="720" y="20" width="268" height="566" rx="8" />
    <text class="label" x="854" y="44">Memory</text>
  </g>
  <g id="cells">
    <g id="cell-0"><text class="cell-address" x="776" y="80">0</text><rect class="cell" x="786" y="66" width="180" height="28" /><text class="value" x="876" y="80">LOAD 14</text></g>
    <g id="cell-1"><text class="cell-address" x="776" y="112">1</text><rect class="cell" x="786" y="98" width="180" height="28" /><text class="value" x="876" y="112">ADD 12</text></g>
    <g id="cell-2"><text class="cell-address" x="776" y="144">2</text><rect class="cell" x="786" y="130" width="180" height="28" /><text class="value" x="876" y="144">STORE 14</text></g>
    <g id="cell-3"><text class="cell-address" x="776" y="176">3</text><rect class="cell" x="786" y="162" width="180" height="28" /><text class="value" x="876" y="176">LOAD 13</text></g>
    <g id="cell-4"><text class="cell-address" x="776" y="208">4</text><rect class="cell" x="786" y="194" width="180" height="28" /><text class="value" x="876" y="208">SUB 15</text></g>
    <g id="cell-5"><text class="cell-address" x="776" y="240">5</text><rect class="cell" x="786" y="226" width="180" height="28" /><text class="value" x="876" y="240">STORE 13</text></g>
    <g id="cell-6"><text class="cell-address" x="776" y="272">6</text><rect class="cell" x="786" y="258" width="180" height="28" /><text class="value" x="876" y="272">JUMPZ 8</text></g>
    <g id="cell-7"><text class="cell-address" x="776" y="304">7</text><rect class="cell" x="786" y="290" width="180" height="28" /><text class="value" x="876" y="304">JUMP 0</text></g>
    <g id="cell-8"><text class="cell-address" x="776" y="336">8</text><rect class="cell" x="786" y="322" width="180" height="28" /><text class="value" x="876" y="336">HALT</text></g>
    <g id="cell-9"><text class="cell-address" x="776" y="368">9</text><rect class="cell" x="786" y="354" width="180" height="28" /></g>
    <g id="cell-10"><text class="cell-address" x="776" y="400">10</text><rect class="cell" x="786" y="386" width="180" height="28" /></g>
    <g id="cell-11"><text class="cell-address" x="776" y="432">11</text><rect class="cell" x="786" y="418" width="180" height="28" /></g>
    <g id="cell-12"><text class="cell-address" x="776" y="464">12</text><rect class="cell" x="786" y="450" width="180" height="28" /><text class="value" x="876" y="464">00000011</text></g>
    <g id="cell-13"><text class="cell-address" x="776" y="496">13</text><rect class="cell" x="786" y="482" width="180" height="28" /><text class="value" x="876" y="496">00000010</text></g>
    <g id="cell-14"><text class="cell-address" x="776" y="528">14</text><rect class="cell" x="786" y="514" width="180" height="28" /><text class="value" x="876" y="528">00000000</text></g>
    <g id="cell-15"><text class="cell-address" x="776" y="560">15</text><rect class="cell" x="786" y="546" width="180" height="28" /><text class="value" x="876" y="560">00000001</text></g>
  </g>
</svg>
