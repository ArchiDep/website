<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="The machine: a processor with a program counter, a control unit holding the instruction register, an accumulator, an ALU and a clock, connected to a memory of 16 cells by an 8-bit data bus and a 4-bit address bus">
  <defs>
    <!-- Block arrowheads, sized relative to the path's width: a path ending
         in one stops 35 units short of its target. -->
    <marker id="data-arrow" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#1971c2" />
    </marker>
    <marker id="address-arrow" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#e8590c" />
    </marker>
    <!-- Thin arrowhead, for a single wire -->
    <marker id="wire-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f" />
    </marker>
  </defs>

  <style>
    .frame { fill: none; stroke: #a3a3a8; stroke-width: 2; stroke-dasharray: 8 6; }
    .box { fill: #ffffff; stroke: #1d1d1f; stroke-width: 3; }
    .label { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    .data-path { fill: none; stroke: #1971c2; stroke-width: 22; stroke-linejoin: miter; }
    .address-path { fill: none; stroke: #e8590c; stroke-width: 22; stroke-linejoin: miter; }
    .data-bus { fill: #1971c2; }
    .address-bus { fill: #e8590c; }
    .wire { fill: none; stroke: #1d1d1f; stroke-width: 3; }
    /* A wire that goes on somewhere not drawn */
    .wire-dots { fill: none; stroke: #1d1d1f; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 0 7; }
    .bus-label { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .cell { fill: #ffffff; stroke: #a3a3a8; stroke-width: 1.5; }
    .bit { fill: #ffffff; stroke: #1d1d1f; stroke-width: 1.5; }
    .step { fill: #ffffff; stroke: #a3a3a8; stroke-width: 1.5; }
    .cell-address { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #6e6e73; text-anchor: end; dominant-baseline: middle; }
    .bits { font-family: Menlo, Consolas, monospace; font-size: 15px; fill: #1d1d1f; dominant-baseline: middle; }
    .bits.unused { fill: #a3a3a8; }
    .annotation { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1971c2; text-anchor: end; dominant-baseline: middle; }
  </style>

  <!-- The processor, titled by a pill in its bottom-right corner -->
  <path d="M600 556 V574 A16 16 0 0 1 584 590 H486 V572 A16 16 0 0 1 502 556 Z" fill="#f0f0f2" />
  <rect class="frame" x="10" y="10" width="590" height="580" rx="16" />
  <path class="frame" d="M600 556 H502 A16 16 0 0 0 486 572 V590" />
  <text class="label" x="543" y="574" style="font-size: 18px; fill: #6e6e73">8-bit CPU</text>

  <g id="control-unit">
    <rect class="box" x="40" y="145" width="460" height="140" rx="8" />
    <text class="label" x="410" y="168">Control unit</text>
  </g>

  <!-- Paths, drawn under the boxes and buses they connect. Arrowheads mark the
       paths data only ever takes one way; flat ends are two-way. -->
  <g id="paths">
    <path id="path-pc-selector" class="address-path" d="M216 55 H435" marker-end="url(#address-arrow)" />
    <path id="path-ir-selector" class="address-path" d="M293 214 V95 H435" marker-end="url(#address-arrow)" />
    <path id="path-ir-pc" class="address-path" d="M205 214 V157" marker-end="url(#address-arrow)" />
    <path id="path-bus-ir" class="data-path" d="M100 484 V279" marker-end="url(#data-arrow)" />
    <path id="path-acc-bus" class="data-path" d="M190 385 V484" />
    <path id="path-alu-acc" class="data-path" d="M444 372 H409" marker-end="url(#data-arrow)" />
    <path id="path-bus-alu" class="data-path" d="M631 341 H555" marker-end="url(#data-arrow)" />
    <path id="path-acc-alu" class="data-path" d="M330 385 V450 H560 V405 H555" marker-end="url(#data-arrow)" />
  </g>

  <!-- Buses -->
  <path id="path-selector-address-bus" class="address-path" d="M526 75 H669" />
  <path id="path-data-bus-memory" class="data-path" d="M631 491 H742" />
  <g id="data-bus">
    <rect class="data-bus" x="620" y="20" width="22" height="568" />
    <rect class="data-bus" x="80" y="480" width="562" height="22" />
    <text class="bus-label" x="330" y="492">Data bus · 8 bits</text>
  </g>
  <g id="address-bus">
    <rect class="address-bus" x="658" y="20" width="22" height="568" />
  </g>
  <path id="path-address-bus-memory" class="address-path" d="M669 75 H705" marker-end="url(#address-arrow)" />
  <text class="bus-label" x="669" y="300" transform="rotate(-90 669 300)">Address bus · 4 bits</text>

  <!-- Selector: chooses whether the program counter or the instruction gives
       the address -->
  <g id="selector">
    <polygon class="box" points="470,30 530,50 530,100 470,120" />
    <text class="small" x="500" y="22">Selector</text>
  </g>

  <!-- The control signal that picks the selector's input -->
  <path id="wire-select" class="wire" d="M490 145 V117" marker-end="url(#wire-arrow)" />

  <!-- Program counter: a counter, not a plain register -->
  <g id="program-counter">
    <rect class="box" x="30" y="36" width="190" height="86" rx="8" />
    <text class="label" x="125" y="58">Program counter</text>
    <rect class="bit" x="69" y="76" width="28" height="34" /><rect class="bit" x="97" y="76" width="28" height="34" /><rect class="bit" x="125" y="76" width="28" height="34" /><rect class="bit" x="153" y="76" width="28" height="34" />
  </g>

  <!-- Instruction register: 4 bits of operation, 4 bits of address -->
  <g id="instruction-register"><rect class="bit" x="80" y="210" width="28" height="34" /><rect class="bit" x="108" y="210" width="28" height="34" /><rect class="bit" x="136" y="210" width="28" height="34" /><rect class="bit" x="164" y="210" width="28" height="34" /><rect class="bit" x="192" y="210" width="28" height="34" /><rect class="bit" x="220" y="210" width="28" height="34" /><rect class="bit" x="248" y="210" width="28" height="34" /><rect class="bit" x="276" y="210" width="28" height="34" /><line x1="192" y1="206" x2="192" y2="248" stroke="#1d1d1f" stroke-width="4" /></g>
  <text class="tiny" x="136" y="197">operation</text>
  <text class="tiny" x="248" y="197">address</text>
  <text class="small" x="192" y="262">Instruction register</text>

  <!-- The control unit's cycle, one step lit at a time by the animation -->
  <g id="steps">
    <g id="step-fetch"><rect class="step" x="355" y="184" width="110" height="24" rx="12" /><text class="tiny" x="410" y="196">Fetch</text></g>
    <g id="step-decode"><rect class="step" x="355" y="216" width="110" height="24" rx="12" /><text class="tiny" x="410" y="228">Decode</text></g>
    <g id="step-execute"><rect class="step" x="355" y="248" width="110" height="24" rx="12" /><text class="tiny" x="410" y="260">Execute</text></g>
    <path id="wire-step-loop" class="wire" d="M465 260 H484 V196 H469" style="stroke-width: 2" marker-end="url(#wire-arrow)" />
  </g>

  <!-- Accumulator: the same kind of register -->
  <g id="accumulator"><rect class="bit" x="150" y="355" width="28" height="34" /><rect class="bit" x="178" y="355" width="28" height="34" /><rect class="bit" x="206" y="355" width="28" height="34" /><rect class="bit" x="234" y="355" width="28" height="34" /><rect class="bit" x="262" y="355" width="28" height="34" /><rect class="bit" x="290" y="355" width="28" height="34" /><rect class="bit" x="318" y="355" width="28" height="34" /><rect class="bit" x="346" y="355" width="28" height="34" /></g>
  <text class="label" x="262" y="338">Accumulator</text>

  <!-- ALU: two operands in on the right, the result out on the left -->
  <g id="alu">
    <polygon class="box" points="520,320 520,358 506,372 520,386 520,425 440,395 440,350" />
    <text class="label" x="478" y="373">ALU</text>
  </g>

  <!-- The zero flag: a single wire -->
  <path id="wire-zero" class="wire" d="M490 330 V290" marker-end="url(#wire-arrow)" />
  <text class="small" x="503" y="305" style="text-anchor: start">zero</text>

  <!-- The one control signal drawn in full: it tells the ALU to subtract
       instead of add -->
  <path id="wire-subtract" class="wire" d="M450 285 V343" marker-end="url(#wire-arrow)" />
  <text class="small" x="441" y="305" style="text-anchor: end">subtract</text>

  <!-- The control unit's other signals, which only start -->
  <g id="control-signals">
    <path class="wire" d="M500 205 H528" /><path class="wire-dots" d="M535 205 H556" />
    <path class="wire" d="M500 230 H528" /><path class="wire-dots" d="M535 230 H556" />
    <path class="wire" d="M500 255 H528" /><path class="wire-dots" d="M535 255 H556" />
    <text class="tiny" x="550" y="185" style="font-size: 12px">control signals</text>
  </g>

  <!-- Clock: drives every component that holds a value, which is narrated
       rather than drawn -->
  <g id="clock">
    <rect class="box" x="40" y="520" width="160" height="62" rx="8" />
    <text class="label" x="120" y="540">Clock</text>
    <path d="M64 572 H82 V554 H104 V572 H126 V554 H148 V572 H170 V554 H180" fill="none" stroke="#1d1d1f" stroke-width="2.5" />
  </g>
  <g id="wire-clock"><path class="wire" d="M200 551 H228" /><path class="wire-dots" d="M235 551 H256" /></g>
  <text class="tiny" x="207" y="536" style="font-size: 12px; text-anchor: start">to every register</text>

  <!-- Memory: the program of the trace, then its data -->
  <!-- Each cell holds its bits; the annotation on its right is how the
       processor reads them, an instruction or a number -->
  <g id="memory">
    <rect class="box" x="740" y="20" width="248" height="566" rx="8" />
    <text class="label" x="864" y="44">Memory</text>
  </g>
  <g id="cells">
    <g id="cell-0"><text class="cell-address" x="796" y="80">0</text><rect class="cell" x="806" y="66" width="170" height="28" /><text class="bits" x="813" y="80">0001 1110</text><text class="annotation" x="969" y="80">LOAD 14</text></g>
    <g id="cell-1"><text class="cell-address" x="796" y="112">1</text><rect class="cell" x="806" y="98" width="170" height="28" /><text class="bits" x="813" y="112">0010 1100</text><text class="annotation" x="969" y="112">ADD 12</text></g>
    <g id="cell-2"><text class="cell-address" x="796" y="144">2</text><rect class="cell" x="806" y="130" width="170" height="28" /><text class="bits" x="813" y="144">0100 1110</text><text class="annotation" x="969" y="144">STORE 14</text></g>
    <g id="cell-3"><text class="cell-address" x="796" y="176">3</text><rect class="cell" x="806" y="162" width="170" height="28" /><text class="bits" x="813" y="176">0001 1101</text><text class="annotation" x="969" y="176">LOAD 13</text></g>
    <g id="cell-4"><text class="cell-address" x="796" y="208">4</text><rect class="cell" x="806" y="194" width="170" height="28" /><text class="bits" x="813" y="208">0011 1111</text><text class="annotation" x="969" y="208">SUB 15</text></g>
    <g id="cell-5"><text class="cell-address" x="796" y="240">5</text><rect class="cell" x="806" y="226" width="170" height="28" /><text class="bits" x="813" y="240">0100 1101</text><text class="annotation" x="969" y="240">STORE 13</text></g>
    <g id="cell-6"><text class="cell-address" x="796" y="272">6</text><rect class="cell" x="806" y="258" width="170" height="28" /><text class="bits" x="813" y="272">1000 1000</text><text class="annotation" x="969" y="272">JUMPZ 8</text></g>
    <g id="cell-7"><text class="cell-address" x="796" y="304">7</text><rect class="cell" x="806" y="290" width="170" height="28" /><text class="bits" x="813" y="304">0110 0000</text><text class="annotation" x="969" y="304">JUMP 0</text></g>
    <g id="cell-8"><text class="cell-address" x="796" y="336">8</text><rect class="cell" x="806" y="322" width="170" height="28" /><text class="bits" x="813" y="336">1111 0000</text><text class="annotation" x="969" y="336">HALT</text></g>
    <g id="cell-9"><text class="cell-address" x="796" y="368">9</text><rect class="cell" x="806" y="354" width="170" height="28" /><text class="bits unused" x="813" y="368">0000 0000</text></g>
    <g id="cell-10"><text class="cell-address" x="796" y="400">10</text><rect class="cell" x="806" y="386" width="170" height="28" /><text class="bits unused" x="813" y="400">0000 0000</text></g>
    <g id="cell-11"><text class="cell-address" x="796" y="432">11</text><rect class="cell" x="806" y="418" width="170" height="28" /><text class="bits unused" x="813" y="432">0000 0000</text></g>
    <g id="cell-12"><text class="cell-address" x="796" y="464">12</text><rect class="cell" x="806" y="450" width="170" height="28" /><text class="bits" x="813" y="464">0000 0011</text><text class="annotation" x="969" y="464">3</text></g>
    <g id="cell-13"><text class="cell-address" x="796" y="496">13</text><rect class="cell" x="806" y="482" width="170" height="28" /><text class="bits" x="813" y="496">0000 0010</text><text class="annotation" x="969" y="496">2</text></g>
    <g id="cell-14"><text class="cell-address" x="796" y="528">14</text><rect class="cell" x="806" y="514" width="170" height="28" /><text class="bits" x="813" y="528">0000 0000</text><text class="annotation" x="969" y="528">0</text></g>
    <g id="cell-15"><text class="cell-address" x="796" y="560">15</text><rect class="cell" x="806" y="546" width="170" height="28" /><text class="bits" x="813" y="560">0000 0001</text><text class="annotation" x="969" y="560">1</text></g>
  </g>
  <!-- The memory's read/write control signal, arriving from somewhere not
       drawn -->
  <g id="wire-read-write"><path class="wire-dots" d="M712 538 V552.5" /><path class="wire" d="M712 559 V576 H737" marker-end="url(#wire-arrow)" /></g>
  <text class="tiny" x="747" y="576" style="font-size: 11px; text-anchor: start">R/W</text>
</svg>
