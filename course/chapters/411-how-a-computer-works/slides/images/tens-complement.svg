<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="The values from -50 to 49, split in two: 0 to 49 are written 00 to 49, and -50 to -1 are written 50 to 99">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#27272a" />
</marker>
</defs>
<rect x="0" y="0" width="640" height="260" fill="#d4d4d8" />
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central">
<text x="70" y="62" fill="#27272a" font-weight="600">Value</text>
<rect x="130" y="40" width="238" height="44" fill="#c2410c" />
<rect x="372" y="40" width="238" height="44" fill="#1d4ed8" />
<text x="249" y="62" fill="#ffffff">−50 … −1</text>
<text x="491" y="62" fill="#ffffff">0 … 49</text>
<text x="70" y="198" fill="#27272a" font-weight="600">Written</text>
<rect x="130" y="176" width="238" height="44" fill="#1d4ed8" />
<rect x="372" y="176" width="238" height="44" fill="#c2410c" />
<text x="249" y="198" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">00 … 49</text>
<text x="491" y="198" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">50 … 99</text>
</g>
<g stroke="#27272a" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M 491 90 L 255 168" />
<path d="M 249 90 L 485 168" />
</g>
</svg>
