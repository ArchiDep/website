<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="The machine at boot: the same processor connected to a firmware chip, memory and storage by the data bus and the address bus">
  <defs>
    <!-- Block arrowheads, sized relative to the path's width: a path ending
         in one stops 35 units short of its target. -->
    <marker id="data-arrow" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#1971c2" />
    </marker>
    <marker id="address-arrow" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#e8590c" />
    </marker>
    <!-- Thin arrowhead, for a single wire -->
    <marker id="wire-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f" />
    </marker>
  </defs>

  <style>
    .frame { fill: none; stroke: #a3a3a8; stroke-width: 2; stroke-dasharray: 8 6; }
    .box { fill: #ffffff; stroke: #1d1d1f; stroke-width: 3; }
    .label { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    .data-path { fill: none; stroke: #1971c2; stroke-width: 22; stroke-linejoin: miter; }
    .address-path { fill: none; stroke: #e8590c; stroke-width: 22; stroke-linejoin: miter; }
    .data-bus { fill: #1971c2; }
    .address-bus { fill: #e8590c; }
    .wire { fill: none; stroke: #1d1d1f; stroke-width: 3; }
    .bus-label { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .cell { fill: #ffffff; stroke: #a3a3a8; stroke-width: 1.5; }
    .bit { fill: #ffffff; stroke: #1d1d1f; stroke-width: 1.5; }
    .cell-address { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #6e6e73; text-anchor: end; dominant-baseline: middle; }
    .value { font-family: Menlo, Consolas, monospace; font-size: 17px; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- The processor -->
  <rect class="frame" x="10" y="10" width="590" height="580" rx="16" />
  <text class="small" x="62" y="22">Processor</text>

  <g id="control-unit">
    <rect class="box" x="40" y="145" width="460" height="140" rx="8" />
    <text class="label" x="410" y="215">Control unit</text>
  </g>

  <!-- Paths, drawn under the boxes and buses they connect. Arrowheads mark the
       paths data only ever takes one way; flat ends are two-way. -->
  <g id="paths">
    <path id="path-pc-selector" class="address-path" d="M216 55 H435" marker-end="url(#address-arrow)" />
    <path id="path-ir-selector" class="address-path" d="M282 214 V95 H435" marker-end="url(#address-arrow)" />
    <path id="path-ir-pc" class="address-path" d="M293 95 H255" marker-end="url(#address-arrow)" />
    <path id="path-bus-ir" class="data-path" d="M100 484 V279" marker-end="url(#data-arrow)" />
    <path id="path-acc-bus" class="data-path" d="M190 365 V484" />
    <path id="path-alu-acc" class="data-path" d="M444 352 H409" marker-end="url(#data-arrow)" />
    <path id="path-bus-alu" class="data-path" d="M631 321 H555" marker-end="url(#data-arrow)" />
    <path id="path-acc-alu" class="data-path" d="M330 365 V430 H560 V385 H555" marker-end="url(#data-arrow)" />
  </g>

  <!-- Buses -->
  <path id="path-selector-address-bus" class="address-path" d="M526 75 H669" />
  <path id="path-data-bus-firmware" class="data-path" d="M631 130 H742" />
  <path id="path-data-bus-memory" class="data-path" d="M631 345 H742" />
  <path id="path-data-bus-storage" class="data-path" d="M631 560 H742" />
  <g id="data-bus">
    <rect class="data-bus" x="620" y="20" width="22" height="568" />
    <rect class="data-bus" x="80" y="480" width="562" height="22" />
    <text class="bus-label" x="330" y="492">Data bus · 8 bits</text>
  </g>
  <g id="address-bus">
    <rect class="address-bus" x="658" y="20" width="22" height="568" />
  </g>
  <path id="path-address-bus-firmware" class="address-path" d="M669 75 H705" marker-end="url(#address-arrow)" />
  <path id="path-address-bus-memory" class="address-path" d="M669 250 H705" marker-end="url(#address-arrow)" />
  <path id="path-address-bus-storage" class="address-path" d="M669 470 H705" marker-end="url(#address-arrow)" />
  <text class="bus-label" x="669" y="300" transform="rotate(-90 669 300)">Address bus · 4 bits</text>

  <!-- Selector: chooses whether the program counter or the instruction gives
       the address -->
  <g id="selector">
    <polygon class="box" points="470,30 530,50 530,100 470,120" />
    <text class="small" x="500" y="22">Selector</text>
  </g>

  <!-- Program counter: a counter, not a plain register -->
  <g id="program-counter">
    <rect class="box" x="30" y="36" width="190" height="86" rx="8" />
    <text class="label" x="125" y="58">Program counter</text>
<rect class="bit" x="69" y="76" width="28" height="34" /><rect class="bit" x="97" y="76" width="28" height="34" /><rect class="bit" x="125" y="76" width="28" height="34" /><rect class="bit" x="153" y="76" width="28" height="34" />  </g>

  <!-- Instruction register: 4 bits of operation, 4 bits of address -->
  <g id="instruction-register"><rect class="bit" x="80" y="210" width="28" height="34" /><rect class="bit" x="108" y="210" width="28" height="34" /><rect class="bit" x="136" y="210" width="28" height="34" /><rect class="bit" x="164" y="210" width="28" height="34" /><rect class="bit" x="192" y="210" width="28" height="34" /><rect class="bit" x="220" y="210" width="28" height="34" /><rect class="bit" x="248" y="210" width="28" height="34" /><rect class="bit" x="276" y="210" width="28" height="34" /><line x1="192" y1="206" x2="192" y2="248" stroke="#1d1d1f" stroke-width="4" /></g>
  <text class="tiny" x="136" y="197">operation</text>
  <text class="tiny" x="230" y="197">address</text>
  <text class="small" x="192" y="262">Instruction register</text>

  <!-- Accumulator: the same kind of register -->
  <g id="accumulator"><rect class="bit" x="150" y="335" width="28" height="34" /><rect class="bit" x="178" y="335" width="28" height="34" /><rect class="bit" x="206" y="335" width="28" height="34" /><rect class="bit" x="234" y="335" width="28" height="34" /><rect class="bit" x="262" y="335" width="28" height="34" /><rect class="bit" x="290" y="335" width="28" height="34" /><rect class="bit" x="318" y="335" width="28" height="34" /><rect class="bit" x="346" y="335" width="28" height="34" /></g>
  <text class="label" x="262" y="318">Accumulator</text>

  <!-- ALU: two operands in on the right, the result out on the left -->
  <g id="alu">
    <polygon class="box" points="520,300 520,338 506,352 520,366 520,405 440,375 440,330" />
    <text class="label" x="478" y="353">ALU</text>
  </g>

  <!-- The zero flag: a single wire -->
  <path id="wire-zero" class="wire" d="M480 314 V290" marker-end="url(#wire-arrow)" />
  <text class="small" x="467" y="300" style="text-anchor: end">zero</text>

  <!-- Clock: drives every component, which is narrated rather than drawn -->
  <g id="clock">
    <rect class="box" x="40" y="520" width="160" height="62" rx="8" />
    <text class="label" x="120" y="540">Clock</text>
    <path d="M64 572 H82 V554 H104 V572 H126 V554 H148 V572 H170 V554 H180" fill="none" stroke="#1d1d1f" stroke-width="2.5" />
  </g>

  <!-- Firmware: where the processor starts -->
  <g id="firmware">
    <rect class="box" x="740" y="20" width="248" height="150" rx="8" />
    <text class="label" x="864" y="83">Firmware</text>
    <text class="small" x="864" y="113">ROM chip: UEFI</text>
  </g>

  <!-- Memory: empty at power-on -->
  <g id="memory">
    <rect class="box" x="740" y="200" width="248" height="200" rx="8" />
    <text class="label" x="864" y="285">Memory</text>
    <text class="small" x="864" y="315">RAM: empty at power-on</text>
  </g>

  <!-- Storage: holds the bootloader, the kernel and every other program -->
  <g id="storage">
    <rect class="box" x="740" y="430" width="248" height="156" rx="8" />
    <text class="label" x="864" y="481">Storage</text>
    <text class="small" x="864" y="511">Disk: bootloader, kernel,</text>
    <text class="small" x="864" y="533">programs, files</text>
  </g>
</svg>
