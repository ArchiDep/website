<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="The machine at boot: a 64-bit processor with sixteen registers, connected to a firmware chip, memory and a disk controller by a 64-bit data bus and a 64-bit address bus, with the storage behind the disk controller">
  <defs>
    <!-- Block arrowheads, sized relative to the path's width: a path ending
         in one stops 35 units short of its target. -->
    <marker id="data-arrow" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#1971c2" />
    </marker>
    <marker id="address-arrow" viewBox="0 0 8 10" refX="0" refY="5" markerWidth="1.6" markerHeight="2" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#e8590c" />
    </marker>
    <!-- Thin arrowhead, for a single wire -->
    <marker id="wire-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f" />
    </marker>
  </defs>

  <style>
    .frame { fill: none; stroke: #a3a3a8; stroke-width: 2; stroke-dasharray: 8 6; }
    .box { fill: #ffffff; stroke: #1d1d1f; stroke-width: 3; }
    .label { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #6e6e73; text-anchor: middle; dominant-baseline: middle; }
    .data-path { fill: none; stroke: #1971c2; stroke-width: 22; stroke-linejoin: miter; }
    .address-path { fill: none; stroke: #e8590c; stroke-width: 22; stroke-linejoin: miter; }
    .data-bus { fill: #1971c2; }
    .address-bus { fill: #e8590c; }
    .wire { fill: none; stroke: #1d1d1f; stroke-width: 3; }
    .bus-label { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .cell { fill: #ffffff; stroke: #a3a3a8; stroke-width: 1.5; }
    .bit { fill: #ffffff; stroke: #1d1d1f; stroke-width: 1.5; }
    .step { fill: #ffffff; stroke: #a3a3a8; stroke-width: 1.5; }
    .cell-address { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #6e6e73; text-anchor: end; dominant-baseline: middle; }
    .value { font-family: Menlo, Consolas, monospace; font-size: 17px; fill: #1d1d1f; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- The processor -->
  <rect class="frame" x="10" y="10" width="590" height="580" rx="16" />
  <text class="small" x="62" y="22">Processor</text>

  <g id="control-unit">
    <rect class="box" x="40" y="145" width="460" height="140" rx="8" />
    <text class="label" x="420" y="215">Control unit</text>
  </g>

  <!-- Paths, drawn under the boxes and buses they connect. Arrowheads mark the
       paths data only ever takes one way; flat ends are two-way. -->
  <g id="paths">
    <path id="path-pc-selector" class="address-path" d="M216 55 H435" marker-end="url(#address-arrow)" />
    <path id="path-ir-selector" class="address-path" d="M255 214 V95 H435" marker-end="url(#address-arrow)" />
    <path id="path-ir-pc" class="address-path" d="M205 214 V157" marker-end="url(#address-arrow)" />
    <!-- An address held in a register joins the instruction's path to the
         selector -->
    <path id="path-registers-selector" class="address-path" d="M325 310 V95" />
    <path id="path-bus-ir" class="data-path" d="M100 484 V279" marker-end="url(#data-arrow)" />
    <path id="path-registers-bus" class="data-path" d="M170 390 V484" />
    <path id="path-registers-alu-a" class="data-path" d="M336 334 H365" marker-end="url(#data-arrow)" />
    <path id="path-registers-alu-b" class="data-path" d="M336 380 H365" marker-end="url(#data-arrow)" />
    <path id="path-alu-registers" class="data-path" d="M476 356 H550 V452 H290 V427" marker-end="url(#data-arrow)" />
  </g>

  <!-- Buses -->
  <path id="path-selector-address-bus" class="address-path" d="M526 75 H669" />
  <path id="path-data-bus-firmware" class="data-path" d="M631 130 H742" />
  <path id="path-data-bus-memory" class="data-path" d="M631 315 H742" />
  <path id="path-data-bus-controller" class="data-path" d="M631 445 H742" />
  <g id="data-bus">
    <rect class="data-bus" x="620" y="20" width="22" height="568" />
    <rect class="data-bus" x="80" y="480" width="562" height="22" />
    <text class="bus-label" x="330" y="492">Data bus · 64 bits</text>
  </g>
  <g id="address-bus">
    <rect class="address-bus" x="658" y="20" width="22" height="568" />
  </g>
  <path id="path-address-bus-firmware" class="address-path" d="M669 75 H705" marker-end="url(#address-arrow)" />
  <path id="path-address-bus-memory" class="address-path" d="M669 235 H705" marker-end="url(#address-arrow)" />
  <path id="path-address-bus-controller" class="address-path" d="M669 405 H705" marker-end="url(#address-arrow)" />
  <!-- The firmware is only read: a small arrow inside its data path, since an
       arrowhead at its end would cut it off from the firmware -->
  <polygon points="718,123 718,137 706,130" fill="#ffffff" />
  <text class="bus-label" x="669" y="300" transform="rotate(-90 669 300)">Address bus · 64 bits</text>

  <!-- Selector: chooses whether the program counter or the instruction gives
       the address -->
  <g id="selector">
    <polygon class="box" points="470,30 530,50 530,100 470,120" />
    <text class="small" x="500" y="22">Selector</text>
  </g>

  <!-- Program counter: a counter, not a plain register -->
  <g id="program-counter">
    <rect class="box" x="30" y="36" width="190" height="86" rx="8" />
    <text class="label" x="125" y="58">Program counter</text>
    <rect class="bit" x="69" y="76" width="112" height="34" /><text class="tiny" x="125" y="93">64 bits</text>
  </g>

  <!-- Instruction register: an x86-64 instruction is 1 to 15 bytes long,
       with no fixed split -->
  <g id="instruction-register"><rect class="bit" x="80" y="210" width="224" height="34" /><text class="tiny" x="192" y="227">1 to 15 bytes</text></g>
  <text class="small" x="192" y="262">Instruction</text>

  <!-- Registers: x86-64 has 16 general-purpose registers of 64 bits -->
  <g id="registers">
    <rect class="box" x="120" y="296" width="220" height="96" rx="8" />
    <text class="small" x="230" y="312"><tspan class="label" style="font-size: 18px">Registers</tspan> · 16 × 64 bits</text>
    <rect class="bit" x="136" y="326" width="188" height="16" /><rect class="bit" x="136" y="348" width="188" height="16" />
    <text class="label" x="230" y="374">…</text>
  </g>

  <!-- ALU: two operands in on the left, the result out on the right -->
  <g id="alu">
    <polygon class="box" points="400,316 400,342 414,356 400,370 400,396 480,372 480,340" />
    <text class="label" x="443" y="357">ALU</text>
  </g>

  <!-- The zero flag: a single wire -->
  <path id="wire-zero" class="wire" d="M440 329 V290" marker-end="url(#wire-arrow)" />
  <text class="small" x="428" y="304" style="text-anchor: end">zero</text>

  <!-- Clock: drives every component that holds a value, which is narrated
       rather than drawn -->
  <g id="clock">
    <rect class="box" x="40" y="520" width="160" height="62" rx="8" />
    <text class="label" x="120" y="540">Clock</text>
    <path d="M64 572 H82 V554 H104 V572 H126 V554 H148 V572 H170 V554 H180" fill="none" stroke="#1d1d1f" stroke-width="2.5" />
  </g>

  <!-- Firmware: where the processor starts -->
  <g id="firmware">
    <rect class="box" x="740" y="20" width="248" height="150" rx="8" />
    <text class="label" x="864" y="83">Firmware</text>
    <text class="small" x="864" y="113">ROM chip: UEFI</text>
  </g>

  <!-- Memory: no program in it yet at power-on -->
  <g id="memory">
    <rect class="box" x="740" y="195" width="248" height="160" rx="8" />
    <text class="label" x="864" y="261">Memory</text>
    <text class="small" x="864" y="291">RAM: no program yet</text>
  </g>

  <!-- Disk controller: on the buses, unlike the storage behind it, which the
       processor cannot address -->
  <path id="path-controller-storage" class="data-path" d="M864 465 V500" />
  <g id="disk-controller">
    <rect class="box" x="740" y="380" width="248" height="90" rx="8" />
    <text class="label" x="864" y="425">Disk controller</text>
  </g>

  <!-- Storage: holds the bootloader, the kernel and every other program -->
  <g id="storage">
    <rect class="box" x="740" y="495" width="248" height="91" rx="8" />
    <text class="label" x="864" y="518">Storage</text>
    <text class="small" x="864" y="546">Disk: bootloader, kernel,</text>
    <text class="small" x="864" y="568">programs, files</text>
  </g>
</svg>
