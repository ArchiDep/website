<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <title>Without a reverse proxy, the browser talks to the frontend and the backend at two different names, two origins; with a reverse proxy, the browser talks to one name, which forwards to both</title>
  <style>
    svg { font-family: 'PT Sans', Helvetica, Arial, sans-serif; }
    .card { fill: #fff; }
    .process rect { fill: #f9505a; stroke: #c93a43; stroke-width: 1; }
    .process text { fill: #fff; text-anchor: middle; }
    .process .label { font-size: 20px; font-weight: 700; }
    .process .sub { font-size: 15px; font-style: italic; }
    .machine rect { fill: #e6e6ee; stroke: #2b2b3a; stroke-width: 2.5; }
    .machine line { stroke: #2b2b3a; stroke-width: 2.5; }
    .edge path { fill: none; stroke: #000; stroke-width: 1.5; }
    .edge.control path { stroke-dasharray: 4 5; }
    .edge text { font-size: 16px; fill: #000; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 8px; stroke-linejoin: round; }
    .marker-comm { fill: #000; }
    .marker-control { fill: #fff; stroke: #000; stroke-width: 1.5; }
    .socket path { fill: none; stroke: #000; stroke-width: 1.75; stroke-linecap: round; }
    .socket text { font-size: 16px; fill: #000; text-anchor: end; }
    .region rect { fill: none; stroke: #2b2b3a; stroke-width: 2; stroke-dasharray: 10 8; }
    .region text { font-size: 18px; font-style: italic; fill: #2b2b3a; text-anchor: middle; }
    .boundary line { stroke: #000; stroke-width: 3; stroke-dasharray: 12 10; }
    .cloud path { fill: #fff; stroke: #aaa; stroke-width: 2; }
    .cloud text { font-size: 16px; fill: #666; text-anchor: middle; }
    .heading { font-size: 22px; font-weight: 700; fill: #000; text-anchor: middle; }
    .note { font-size: 17px; font-style: italic; fill: #000; text-anchor: middle; }
    .cross { stroke: #c93a43; stroke-width: 5; stroke-linecap: round; opacity: 0.35; }
    .divider { stroke: #999; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow-comm" viewBox="0 0 14 10" refX="14" refY="5" markerWidth="14" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="marker-comm" d="M0,0 L14,5 L0,10 z"/>
    </marker>
    <marker id="arrow-control" viewBox="-1 -1 16 12" refX="14" refY="5" markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path class="marker-control" d="M0,0 L14,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="card" width="900" height="420" rx="12"/>

  <text class="heading" x="245" y="46">Two origins</text>

  <text class="heading" x="680" y="46">One origin</text>

  <line class="divider" x1="470" y1="24" x2="470" y2="396"/>

  <g class="process">
    <rect x="30" y="200" width="150" height="56" rx="8"/>
    <text class="label" x="105" y="235">Browser</text>
  </g>

  <g class="process">
    <rect x="280" y="90" width="170" height="56" rx="8"/>
    <text class="label" x="365" y="125">Frontend</text>
  </g>

  <g class="process">
    <rect x="280" y="310" width="170" height="56" rx="8"/>
    <text class="label" x="365" y="345">Backend</text>
  </g>

  <g class="edge comm">
    <path d="M180,228 C230,228 230,118 276,118" marker-end="url(#arrow-comm)"/>
    <text x="230" y="150">www.example.com</text>
  </g>

  <g class="edge comm">
    <path d="M180,228 C230,228 230,338 276,338" marker-end="url(#arrow-comm)"/>
    <text x="230" y="300">api.example.com</text>
  </g>

  <g class="process">
    <rect x="490" y="200" width="120" height="56" rx="8"/>
    <text class="label" x="550" y="235">Browser</text>
  </g>

  <g class="process">
    <rect x="700" y="200" width="170" height="56" rx="8"/>
    <text class="label" x="785" y="235">Reverse proxy</text>
  </g>

  <g class="process">
    <rect x="700" y="90" width="170" height="56" rx="8"/>
    <text class="label" x="785" y="125">Frontend</text>
  </g>

  <g class="process">
    <rect x="700" y="310" width="170" height="56" rx="8"/>
    <text class="label" x="785" y="345">Backend</text>
  </g>

  <g class="edge comm">
    <path d="M610,228 L696,228" marker-end="url(#arrow-comm)"/>
    <text x="655" y="216">example.com</text>
  </g>

  <g class="edge comm">
    <path d="M785,200 L785,150" marker-end="url(#arrow-comm)"/>
  </g>

  <g class="edge comm">
    <path d="M785,256 L785,306" marker-end="url(#arrow-comm)"/>
  </g>
</svg>
