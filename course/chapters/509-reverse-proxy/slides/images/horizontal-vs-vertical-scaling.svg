<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <title>Vertical scaling makes one server bigger; horizontal scaling adds more servers of the same size</title>
  <style>
    svg { font-family: 'PT Sans', Helvetica, Arial, sans-serif; }
    .card { fill: #fff; }
    .process rect { fill: #f9505a; stroke: #c93a43; stroke-width: 1; }
    .process text { fill: #fff; text-anchor: middle; }
    .process .label { font-size: 20px; font-weight: 700; }
    .process .sub { font-size: 15px; font-style: italic; }
    .machine rect { fill: #e6e6ee; stroke: #2b2b3a; stroke-width: 2.5; }
    .machine line { stroke: #2b2b3a; stroke-width: 2.5; }
    .edge path { fill: none; stroke: #000; stroke-width: 1.5; }
    .edge.control path { stroke-dasharray: 4 5; }
    .edge text { font-size: 16px; fill: #000; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 8px; stroke-linejoin: round; }
    .marker-comm { fill: #000; }
    .marker-control { fill: #fff; stroke: #000; stroke-width: 1.5; }
    .socket path { fill: none; stroke: #000; stroke-width: 1.75; stroke-linecap: round; }
    .socket text { font-size: 16px; fill: #000; text-anchor: end; }
    .region rect { fill: none; stroke: #2b2b3a; stroke-width: 2; stroke-dasharray: 10 8; }
    .region text { font-size: 18px; font-style: italic; fill: #2b2b3a; text-anchor: middle; }
    .boundary line { stroke: #000; stroke-width: 3; stroke-dasharray: 12 10; }
    .cloud path { fill: #fff; stroke: #aaa; stroke-width: 2; }
    .cloud text { font-size: 16px; fill: #666; text-anchor: middle; }
    .heading { font-size: 22px; font-weight: 700; fill: #000; text-anchor: middle; }
    .note { font-size: 17px; font-style: italic; fill: #000; text-anchor: middle; }
    .cross { stroke: #c93a43; stroke-width: 5; stroke-linecap: round; opacity: 0.35; }
    .divider { stroke: #999; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow-comm" viewBox="0 0 14 10" refX="14" refY="5" markerWidth="14" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="marker-comm" d="M0,0 L14,5 L0,10 z"/>
    </marker>
    <marker id="arrow-control" viewBox="-1 -1 16 12" refX="14" refY="5" markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path class="marker-control" d="M0,0 L14,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="card" width="900" height="350" rx="12"/>

  <text class="heading" x="225" y="46">Vertical</text>

  <text class="heading" x="675" y="46">Horizontal</text>

  <line class="divider" x1="450" y1="24" x2="450" y2="336"/>

  <g class="machine">
    <rect x="40" y="228" width="56" height="72" rx="4.48"/>
    <line x1="50.08" y1="246" x2="85.92" y2="246"/>
    <line x1="50.08" y1="264" x2="85.92" y2="264"/>
    <line x1="50.08" y1="282" x2="85.92" y2="282"/>
  </g>

  <g class="machine">
    <rect x="130" y="192" width="84" height="108" rx="6.72"/>
    <line x1="145.12" y1="219" x2="198.88" y2="219"/>
    <line x1="145.12" y1="246" x2="198.88" y2="246"/>
    <line x1="145.12" y1="273" x2="198.88" y2="273"/>
  </g>

  <g class="machine">
    <rect x="250" y="120" width="140" height="180" rx="11.2"/>
    <line x1="275.2" y1="165" x2="364.8" y2="165"/>
    <line x1="275.2" y1="210" x2="364.8" y2="210"/>
    <line x1="275.2" y1="255" x2="364.8" y2="255"/>
  </g>

  <g class="edge comm">
    <path d="M104,250 L122,250" marker-end="url(#arrow-comm)"/>
  </g>

  <g class="edge comm">
    <path d="M222,250 L242,250" marker-end="url(#arrow-comm)"/>
  </g>

  <text class="note" x="225" y="330">a bigger server</text>

  <g class="machine">
    <rect x="490" y="228" width="56" height="72" rx="4.48"/>
    <line x1="500.08" y1="246" x2="535.92" y2="246"/>
    <line x1="500.08" y1="264" x2="535.92" y2="264"/>
    <line x1="500.08" y1="282" x2="535.92" y2="282"/>
  </g>

  <g class="edge comm">
    <path d="M554,264 L578,264" marker-end="url(#arrow-comm)"/>
  </g>

  <g class="machine">
    <rect x="590" y="228" width="56" height="72" rx="4.48"/>
    <line x1="600.08" y1="246" x2="635.92" y2="246"/>
    <line x1="600.08" y1="264" x2="635.92" y2="264"/>
    <line x1="600.08" y1="282" x2="635.92" y2="282"/>
  </g>

  <g class="machine">
    <rect x="656" y="228" width="56" height="72" rx="4.48"/>
    <line x1="666.08" y1="246" x2="701.92" y2="246"/>
    <line x1="666.08" y1="264" x2="701.92" y2="264"/>
    <line x1="666.08" y1="282" x2="701.92" y2="282"/>
  </g>

  <g class="edge comm">
    <path d="M720,264 L744,264" marker-end="url(#arrow-comm)"/>
  </g>

  <g class="machine">
    <rect x="756" y="140" width="56" height="72" rx="4.48"/>
    <line x1="766.08" y1="158" x2="801.92" y2="158"/>
    <line x1="766.08" y1="176" x2="801.92" y2="176"/>
    <line x1="766.08" y1="194" x2="801.92" y2="194"/>
  </g>

  <g class="machine">
    <rect x="822" y="140" width="56" height="72" rx="4.48"/>
    <line x1="832.08" y1="158" x2="867.92" y2="158"/>
    <line x1="832.08" y1="176" x2="867.92" y2="176"/>
    <line x1="832.08" y1="194" x2="867.92" y2="194"/>
  </g>

  <g class="machine">
    <rect x="756" y="228" width="56" height="72" rx="4.48"/>
    <line x1="766.08" y1="246" x2="801.92" y2="246"/>
    <line x1="766.08" y1="264" x2="801.92" y2="264"/>
    <line x1="766.08" y1="282" x2="801.92" y2="282"/>
  </g>

  <g class="machine">
    <rect x="822" y="228" width="56" height="72" rx="4.48"/>
    <line x1="832.08" y1="246" x2="867.92" y2="246"/>
    <line x1="832.08" y1="264" x2="867.92" y2="264"/>
    <line x1="832.08" y1="282" x2="867.92" y2="282"/>
  </g>

  <text class="note" x="675" y="330">more servers</text>
</svg>
