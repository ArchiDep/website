<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="PT Sans, Helvetica, Arial, sans-serif">
  <title>Network address translation: three computers with private addresses reach the Internet through a NAT router with one public address</title>
  <defs>
    <g id="computer">
      <rect x="-50" y="-60" width="100" height="70" rx="8" fill="#e6e6ee" stroke="#2b2b3a" stroke-width="4"/>
      <rect x="-38" y="-48" width="76" height="46" rx="3" fill="#3aa65a" stroke="#2b2b3a" stroke-width="3"/>
      <rect x="-60" y="18" width="120" height="34" rx="6" fill="#e6e6ee" stroke="#2b2b3a" stroke-width="4"/>
      <circle cx="-44" cy="30" r="4" fill="#3aa65a"/>
      <rect x="0" y="27" width="46" height="7" rx="2" fill="#8f8fb0"/>
    </g>
  </defs>

  <!-- Private network, up to the middle of the router -->
  <rect x="10" y="10" width="580" height="620" rx="20" fill="#ffffff" fill-opacity="0.5" stroke="#2b2b3a" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="300" y="610" font-size="26" font-style="italic" fill="#2b2b3a">Private network</text>

  <!-- Wires -->
  <g stroke="#2b2b3a" stroke-width="5" fill="none">
    <path d="M150 100 H260 V500 H150"/>
    <path d="M150 300 H470"/>
    <path d="M710 300 H950"/>
  </g>

  <!-- Computers -->
  <use href="#computer" x="90" y="90"/>
  <use href="#computer" x="90" y="290"/>
  <use href="#computer" x="90" y="490"/>
  <g font-size="26" font-weight="bold" fill="#1a1a5e" text-anchor="middle" font-family="PT Mono, Menlo, Consolas, monospace">
    <text x="95" y="180">10.0.25.23</text>
    <text x="95" y="380">10.0.25.24</text>
    <text x="95" y="580">10.0.25.25</text>
  </g>

  <!-- NAT router -->
  <rect x="470" y="255" width="240" height="90" rx="12" fill="#c9d6ea" stroke="#2b2b3a" stroke-width="4"/>
  <text x="590" y="311" font-size="30" font-weight="bold" fill="#2b2b3a" text-anchor="middle">NAT router</text>
  <g font-size="26" font-weight="bold" fill="#1a1a5e" font-family="PT Mono, Menlo, Consolas, monospace">
    <text x="285" y="286">10.0.25.1</text>
    <text x="725" y="286">203.0.113.11</text>
  </g>

  <!-- Internet -->
  <path d="M990 350 C940 350 935 285 985 275 C980 225 1045 210 1070 245 C1090 205 1160 215 1155 265 C1200 275 1195 350 1150 350 Z" fill="#4fc3f7" stroke="#2b2b3a" stroke-width="4"/>
  <text x="1068" y="316" font-size="28" font-weight="bold" fill="#2b2b3a" text-anchor="middle">Internet</text>
</svg>
