---
# What has become of the pages of past editions that the current one no longer
# answers for by itself, one entry per page, under the year that published it.
#
# Most archived pages need no entry: a chapter that kept its slug is matched
# automatically, so renumbering costs nothing. What belongs here is the diff —
# the pages renamed or dropped since. A page that matches nothing and is
# declared nothing fails the build, which is what stops this file from quietly
# decaying as the course is reworked.
#
# The left of an entry is the archived page's own path; the right is either the
# path of the page of the *current* edition that superseded it, or `gone`.
#
#   2025:
#     /course/104-ssh/: /course/106-secure-shell/
#     /cheatsheets/unix/: gone
#
# Only editions that have ended belong here. The edition being taught has a
# manifest in `archives` too, and that one moves with the material rather than
# being superseded by it: see "What the new edition owes" in docs/rollover.md.

2025:
  # "Shell Scripting" was never taught: it is reference material students look
  # things up in. It became a cheatsheet, and a cheatsheet is a different kind
  # of page from a chapter, so the slug it kept is not enough to match it.
  /course/102-shell-scripting/: /cheatsheets/shell-scripting/
  # The graded exercise is drawn anew each year, so the page it is published on
  # is named for what it is rather than for the application of any one year.
  # 2025 named it after the application it used, "Flood It".
  /course/603-floodit-deployment/: /course/603-graded-deployment/
