server {
  listen 80;
  server_name _ default_server;

  # The edition this image was built with.
  root /var/www/html;

  # A page is published as a directory holding an index.html, so a request
  # without the trailing slash is redirected to one. Relative, because this
  # server sits behind a reverse proxy and does not know the address it is being
  # reached at.
  absolute_redirect off;

  # Stated here rather than in `location /` because the fallbacks below are
  # locations of their own and a page of an archived edition is a directory in
  # exactly the same way.
  index index.html;

  # A page missing from the fallback still answers with the 404 page of the
  # image, which is one error page deep inside another.
  recursive_error_pages on;

  # An edition's global assets. Written as a year pattern rather than as a
  # literal so that the year-end rollover does not have to edit a server block.
  # Every one of them is named after its content by `mix phx.digest`, and an
  # edition that is over never rewrites them, so a browser that has one never
  # has to ask about it again.
  #
  # A file this root does not hold is the first half of a lookup here rather
  # than a mistake, so it is not logged as one: with the fallbacks below on,
  # every request for a finished edition would otherwise write two error lines
  # about the root that was never going to hold it. The fallback locations keep
  # their own logging, so a page that is in neither root is still reported once,
  # naming the root that should have had it.
  location ~ "^/[0-9]{4}/assets/" {
    gzip_static on;
    expires 1y;
    add_header Cache-Control "public, immutable";
    log_not_found off;
    error_page 404 = @archived_assets;
  }

  # The files sitting next to a page, digested by the same rule: the MD5 of the
  # content, inserted before the extension. This stays ahead of the rule below,
  # or an archived edition's page assets would be served as pages are.
  location ~ "-[0-9a-f]{32}(\.[^./]+)?$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    log_not_found off;
    error_page 404 = @archived_assets;
  }

  # The pages of an edition. This differs from the rule below it only by the
  # fallback: the image answers everything it holds, and the trailing-slash
  # redirect a directory gets is part of that. A fallback written as `try_files`
  # instead would take that redirect away, serving a page at a URL its own
  # relative asset links do not resolve from.
  location ~ "^/[0-9]{4}/" {
    log_not_found off;
    error_page 404 = @archived;
  }

  # The marks anchored at the mount point, which every edition shares and which
  # carry no digest.
  location = /favicon.ico {
    expires 1w;
    add_header Cache-Control "public, max-age=604800";
  }

  location /favicons {
    expires 1w;
    add_header Cache-Control "public, max-age=604800";
  }

  # Everything else a build published, and the PDFs mounted beside it. A path
  # this server does not hold is a path nothing published: the reverse proxy
  # sends the application's own URLs to the application, and the unprefixed
  # course paths it still answers for are 301s of its rather than files of ours.
  #
  # The page a build writes for a path it never wrote is what answers those.
  #
  # No fallback here on purpose: the second root is a git checkout whose own
  # README and CNAME sit beside the editions, and this is the rule the root
  # files of the site come through.
  location / {
    error_page 404 /404.html;
  }

  # The finished editions. Two locations rather than one because what the rules
  # above say about caching does not survive an internal redirect, and the
  # distinction they make is the one that matters: a digested file may be kept
  # for a year, a page may not.
  location @archived_assets {
    root /var/www/archives;
    gzip_static on;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location @archived {
    root /var/www/archives;
    error_page 404 /404.html;
  }
}
