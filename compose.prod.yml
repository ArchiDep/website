name: archidep

services:
  rp:
    image: 'traefik:v3.7.10'
    container_name: 'traefik'
    command:
      - '--log.level=DEBUG'
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entryPoints.web.address=:80'
    depends_on:
      - assets-server
    ports:
      - '42000:80'
      - '8080:8080'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'

  # An upstream image with a configuration mounted into it: what it serves is
  # rendered by the application beside it rather than built into an image of
  # ours, so nothing here is rebuilt when the site changes.
  assets-server:
    image: nginx:1.29-alpine
    labels:
      - 'traefik.enable=true'
      # What the course material site publishes: an edition's own tree, under
      # its year, and the files a host keeps exactly one of, at the mount point
      # beside it. A year pattern rather than a literal, so that the year-end
      # rollover does not have to edit a proxy. The application's rule below is
      # this one's exact negation and the two are edited together.
      #
      # `/assets/` is the application's: only the dashboard asks for the
      # unprefixed path, every page of a build carrying its own edition's copy.
      # `/course/` and `/cheatsheets/` are the application's too: nothing is
      # published at either, and it answers both with a permanent redirect into
      # the edition that holds them.
      - "traefik.http.routers.archidep-assets.rule=Host(`localhost`) && (Path(`/`) || PathRegexp(`^/[0-9]{4}/`) || PathPrefix(`/favicons/`) || PathPrefix(`/pdf/`) || PathRegexp(`^/[^/]+\\.[^/]+$`))"
      - 'traefik.http.routers.archidep-assets.entrypoints=web'
      - 'traefik.http.services.archidep-assets.loadbalancer.server.port=80'
    restart: unless-stopped
    volumes:
      - './docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      # The edition this deployment holds, as the application rendered it.
      - 'site:/var/www/site:ro'
      # The finished editions, as a second root this server falls back to.
      - 'archives:/var/www/archives:ro'

  # Fills the volume above, once, then exits. It runs from the application's
  # image, which carries the script, but deliberately not from its entrypoint:
  # this fills a volume and exits, and it does it as root, which is what leaves
  # a clone every other container can read.
  archives:
    image: archidep/website:latest
    build:
      context: .
      target: app
    entrypoint: ['/usr/local/bin/archives.sh']
    environment:
      ARCHIDEP_ARCHIVES_DIRECTORY: /var/lib/archidep/archives
      ARCHIDEP_ARCHIVES_REPOSITORY: https://github.com/ArchiDep/archidep.github.io.git
      ARCHIDEP_ARCHIVES_REF: main
    restart: 'no'
    volumes:
      - 'archives:/var/lib/archidep/archives:rw'

  app:
    image: archidep/website:latest
    build:
      context: .
      target: app
    depends_on:
      - db
    environment:
      ARCHIDEP_AUTH_SWITCH_EDU_ID_CLIENT_ID:
      ARCHIDEP_AUTH_SWITCH_EDU_ID_CLIENT_SECRET:
      ARCHIDEP_AUTH_SWITCH_EDU_ID_ISSUER_URL:
      ARCHIDEP_AUTH_SWITCH_EDU_ID_ROOT_USERS:
      ARCHIDEP_REPO_URL: ecto://archidep:archidep@db:5432/archidep
      ARCHIDEP_SERVERS_API_BASE_URL: http://localhost:42000/api
      ARCHIDEP_SERVERS_SSH_PRIVATE_KEY_FILE: '/etc/archidep/ssh/id_${ARCHIDEP_SERVERS_SSH_PRIVATE_KEY_FILE_TYPE}'
      ARCHIDEP_SERVERS_SSH_PUBLIC_KEY:
      ARCHIDEP_WEB_ENDPOINT_HTTP_IP: 0.0.0.0
      ARCHIDEP_WEB_ENDPOINT_HTTP_PORT: 42000
      ARCHIDEP_WEB_ENDPOINT_LIVE_VIEW_SIGNING_SALT:
      ARCHIDEP_WEB_ENDPOINT_SECRET_KEY_BASE:
      ARCHIDEP_WEB_ENDPOINT_SESSION_SIGNING_SALT:
      ARCHIDEP_WEB_ENDPOINT_UPLOADS_DIRECTORY: /var/lib/archidep/uploads
      ARCHIDEP_WEB_ENDPOINT_URL: http://localhost:42000
    init: true
    labels:
      - 'traefik.enable=true'
      - "traefik.http.routers.archidep-app.rule=Host(`localhost`) && !Path(`/`) && !PathRegexp(`^/[0-9]{4}/`) && !PathPrefix(`/favicons/`) && !PathPrefix(`/pdf/`) && !PathRegexp(`^/[^/]+\\.[^/]+$`)"
      - 'traefik.http.routers.archidep-app.entrypoints=web'
      - 'traefik.http.services.archidep-app.loadbalancer.server.port=42000'
    networks:
      default:
        aliases:
          - archidep-website-app
    restart: unless-stopped
    volumes:
      - ./app/priv/ssh/id_${ARCHIDEP_SERVERS_SSH_PRIVATE_KEY_FILE_TYPE}:/etc/archidep/ssh/id_${ARCHIDEP_SERVERS_SSH_PRIVATE_KEY_FILE_TYPE}:ro
      - ./app/priv/ssh/id_${ARCHIDEP_SERVERS_SSH_PRIVATE_KEY_FILE_TYPE}.pub:/etc/archidep/ssh/id_${ARCHIDEP_SERVERS_SSH_PRIVATE_KEY_FILE_TYPE}.pub:ro
      - app_uploads:/var/lib/archidep/uploads:rw
      # What the application renders the course material site into at boot, and
      # the static server above serves. It is the one writer.
      - 'site:/var/lib/archidep/site:rw'
      # Read-only, and read by one thing: the check that says at boot whether
      # this deployment holds the editions it is supposed to serve. The
      # application serves none of these bytes — the static server above does.
      - 'archives:/var/lib/archidep/archives:ro'

  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: archidep
      POSTGRES_PASSWORD: archidep
      POSTGRES_USER: archidep
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data:rw

volumes:
  app_uploads:
  # Persisted so that a restart transfers deltas and a redeploy transfers
  # nothing.
  archives:
  db_data:
  # Persisted so that the static server has something to serve while the
  # application boots and renders the next build into it.
  site:
