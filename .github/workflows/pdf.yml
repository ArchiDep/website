# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: pdf

on:
  push:
    branches:
      - main
    # A deny-list rather than an allow-list, because the two mistakes are not
    # the same size: a path missing from an allow-list publishes stale PDFs and
    # says nothing, while one missing from here costs a run. Note `**.md` must
    # never be listed — the course material is Markdown.
    paths-ignore:
      - '*.md'
      - '.github/workflows/build.yml'
      - '.github/workflows/publish.yml'
      - 'ansible/**'
      - 'app/priv/repo/**'
      - 'app/test/**'
      - 'docker/**'
      - 'wip/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even where this workflow is normally dormant'
        type: boolean
        default: false

permissions:
  contents: read

# A run rewrites every PDF of the edition, so a newer one supersedes an older
# one rather than queueing behind it. What that costs is a window in which the
# release holds a mix of the two, which the superseding run closes.
concurrency:
  group: 'pdf'
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-24.04
    name: Print & publish the PDFs
    timeout-minutes: 60
    # Dormant outside the public repository, where the minutes are metered; the
    # dispatch input is how it is proved there anyway, once and deliberately.
    if: github.repository == 'ArchiDep/website' || inputs.force
    env:
      ELIXIR_VERSION: 1.19.5
      ERLANG_VERSION: 28.5.0.1
      MIX_ENV: prod
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Build the theme
        run: npm run build
        working-directory: theme

      - name: Build course assets
        run: npm run build
        working-directory: course
        env:
          NODE_ENV: production

      # The same check as in the `build` workflow. Repeated here because this
      # workflow builds the assets itself: what a baked-in address costs here is
      # a slide deck printed with its diagrams missing and its titles in a
      # fallback font, and an export that waits on the network going quiet,
      # which a 404 does.
      - name: Check the assets address themselves relatively
        run: grep -qF 'Automatic publicPath is not supported in this browser' app/priv/static/assets/course/slides-mermaid.js

      - name: Install Erlang/OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Keyed by environment as well, the build directory holding one of them: a
      # key is written once and never replaced, so sharing it with the test
      # build of the `build` workflow would leave whichever ran second with
      # nothing to restore for the life of the lock file.
      - name: Cache app build
        uses: actions/cache@v6
        with:
          path: |
            app/deps
            app/_build
          key: ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get
        working-directory: app

      - name: Compile the app
        run: mix compile
        working-directory: app

      - name: Digest the assets
        run: mix assets.deploy
        working-directory: app

      # Read rather than written here, so that the edition rendered, the base
      # baked into its pages and the release it is uploaded to are one fact
      # instead of three that have to be moved together at the rollover.
      - name: Read the edition being published
        id: edition
        working-directory: app
        run: |
          year="$(mix archidep.course_site.edition | tail -n 1)"
          test -n "$year"
          echo "Publishing the $year edition"
          echo "year=$year" >> "$GITHUB_OUTPUT"

      # No base path: the export maps a URL path straight onto the build
      # directory, so a mount point would prefix every URL the served tree does
      # not have. A build told of no PDF base offers no download link, which is
      # what a build has to do until there is a release to link to.
      - name: Render the site the PDFs are printed from
        working-directory: app
        env:
          ARCHIVE_REPO: ${{ vars.ARCHIDEP_ARCHIVE_REPO }}
          YEAR: ${{ steps.edition.outputs.year }}
        run: |
          args=(--output ../tmp/pdf-build --clean --absolute-base-url https://archidep.ch)
          if [ -n "$ARCHIVE_REPO" ]; then
            args+=(--pdf-base "https://github.com/$ARCHIVE_REPO/releases/download/pdf/$YEAR")
          fi
          mix archidep.course_site.build "${args[@]}"

      # Chrome isolates its renderers in an unprivileged user namespace, which
      # Ubuntu 24.04 denies to unconfined programs through AppArmor; denied it,
      # Chrome refuses to start at all rather than start unsandboxed. Lifted
      # here for the runner, which is a machine thrown away at the end of the
      # job, rather than by passing `--no-sandbox` to the browser: that flag
      # would follow the script onto the machine of anyone printing a build.
      # Nothing to lift is not a failure — the print step below is what has to
      # fail if the sandbox still cannot start.
      - name: Let Chrome's sandbox start
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo 'No unprivileged user namespace restriction to lift'
          fi

      - name: Print the PDFs
        run: npm run pdf -- --build tmp/pdf-build --output tmp/pdf

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # Uploaded whether or not the step below publishes them, being both what
      # a human fetches while nothing does and the evidence of a run whose
      # publication is what failed.
      - name: Upload the PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pdf-${{ steps.edition.outputs.year }}
          path: tmp/pdf
          compression-level: 0
          retention-days: 5

      # The edition's release lives in the archive repository, which does not
      # exist yet. Naming it is what turns this step on, here and in the render
      # above; until then every step but this one runs.
      - name: Publish the PDFs
        if: vars.ARCHIDEP_ARCHIVE_REPO != ''
        env:
          ARCHIVE_REPO: ${{ vars.ARCHIDEP_ARCHIVE_REPO }}
          GH_TOKEN: ${{ secrets.ARCHIDEP_ARCHIVE_TOKEN }}
          YEAR: ${{ steps.edition.outputs.year }}
        run: |
          tag="pdf/$YEAR"
          gh release view "$tag" --repo "$ARCHIVE_REPO" > /dev/null 2>&1 || \
            gh release create "$tag" --repo "$ARCHIVE_REPO" \
              --title "ArchiDep $YEAR PDFs" \
              --notes "Generated PDFs of the $YEAR edition of the course."
          gh release upload "$tag" tmp/pdf/*.pdf --repo "$ARCHIVE_REPO" --clobber
