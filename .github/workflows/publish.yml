name: publish

on:
  # Publishing is what a green build of the main branch leads to, rather than
  # something a push starts in parallel with the build: an image that is pushed
  # here is deployed, so it has to be an image whose commit passed. The build
  # workflow goes on running on every branch of every repository this is
  # mirrored to; only here does anything follow it.
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ELIXIR_OTP: 1.19.5-otp-28

jobs:
  publish:
    # A `workflow_run` fires whatever the build concluded, including failure and
    # cancellation. A manual dispatch carries no build to consult and is taken
    # as deliberate.
    if: >-
      github.repository == 'ArchiDep/website' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      app_digest: ${{ steps.app-push.outputs.digest }}
    env:
      # The commit the build actually ran on. Under `workflow_run` the default
      # `github.sha` is the head of the default branch when the event fired,
      # which is not necessarily the commit that was built — two pushes in quick
      # succession are enough to make them differ, and the image would then be
      # of a commit nothing tested.
      BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The branch that commit was on. Checking out a commit detaches `HEAD`, so
      # the image would otherwise say it was built from `HEAD` — a plausible
      # answer, and a dead source code link on every page of the course material
      # site it serves.
      BUILT_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILT_SHA }}

      - name: Shorten the built commit
        id: built
        run: echo "sha=${BUILT_SHA::7}" >> "$GITHUB_OUTPUT"

      # Compute a short hash of `app/mix.lock` to use as the deps cache tag.
      # When `mix.lock` changes the hash changes and CI will use a new cache tag
      # (automatic invalidation). The hash is exported as a step output
      # `deps_hash` and as `DEPS_HASH` in the environment for convenience.
      # NOTE: `app/mix.lock` must exist; the workflow will fail if it's missing.
      - name: Compute app deps cache hash
        id: deps-hash
        run: |
          set -eux
          if [ ! -f app/mix.lock ]; then
            echo "Error: app/mix.lock not found. Cannot compute deps cache tag." >&2
            exit 1
          fi
          h=$(sha256sum app/mix.lock | cut -d' ' -f1 | cut -c1-12)
          echo "DEPS_HASH=$h" >> $GITHUB_ENV
          echo "deps_hash=$h" >> $GITHUB_OUTPUT
          echo "Computed deps hash: $h"

      # https://github.com/docker/login-action
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ensure Buildx is available in 'docker-container' mode so BuildKit can
      # export cache to a registry. The default docker driver does not support
      # cache export to registry and will fail with "Cache export is not
      # supported for the docker driver" when using `cache-to: type=registry`.
      - name: Set up QEMU (optional, enables cross-platform builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx (container driver)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # https://github.com/docker/metadata-action
      - name: Extract metadata (tags, labels) for the app image
        id: app-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/archidep/app
          # What the deployment pins is the digest, which needs no tag at all.
          # The `main-<sha>` tag exists so that the manifest behind that digest
          # is not an untagged one the registry is free to clean up, and so that
          # the image a host is running can be read back as a commit.
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main-${{ steps.built.outputs.sha }},enable={{is_default_branch}}

      # The app-deps cache image is addressed by its contents: the mix.lock hash
      # and the Elixir/OTP version are the whole of what goes into it. A tag
      # that is already in the registry is therefore already the image this
      # build would produce, and rebuilding it would only spend `mix
      # deps.compile` again to arrive at the same place. Runners start with an
      # empty layer store, so nothing else would catch this.
      - name: Check for an existing app-deps cache image
        id: deps-cache
        run: |
          set -eu
          ref="${{ env.REGISTRY }}/archidep/app-deps-compiled:app-deps-cache-${{ steps.deps-hash.outputs.deps_hash }}-otp-${{ env.ELIXIR_OTP }}"
          if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
            echo "Found $ref; skipping the app-deps build"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No $ref yet; the app-deps build will produce it"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Build and push compiled app deps stage as an app-deps cache image. This
      # compiles dependencies (`mix deps.compile`) into `/build/_build` and
      # `/build/deps` so the heavy compile step can be reused by the release
      # stage. The pushed image is tagged with the short mix.lock hash and the
      # Elixir/OTP version so it is automatically invalidated when deps or the
      # runtime change.
      - name: Build & push app-deps cache
        if: steps.deps-cache.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app-deps-compiled
          push: true
          tags: ${{ env.REGISTRY }}/archidep/app-deps-compiled:app-deps-cache-${{ steps.deps-hash.outputs.deps_hash }}-otp-${{ env.ELIXIR_OTP }}

      # https://github.com/docker/build-push-action
      - name: Build and push the app image
        id: app-push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          build-args: |
            APP_DEPS_IMAGE=${{ env.REGISTRY }}/archidep/app-deps-compiled:app-deps-cache-${{ steps.deps-hash.outputs.deps_hash }}-otp-${{ env.ELIXIR_OTP }}
            ARCHIDEP_GIT_BRANCH=${{ env.BUILT_BRANCH }}
            ARCHIDEP_GIT_REVISION=${{ env.BUILT_SHA }}
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          # Only refs written by a `cache-to` carry the metadata a cache import
          # reads. Plain image tags — the app-deps cache image, `app:latest` —
          # import nothing; they are pulled where they are needed (`FROM
          # ${APP_DEPS_IMAGE}`) rather than consulted here.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/archidep/app:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/archidep/app:buildcache,mode=max

      # https://github.com/actions/attest-build-provenance
      - name: Generate artifact attestation for the app image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/archidep/app
          subject-digest: ${{ steps.app-push.outputs.digest }}
          push-to-registry: true

      # List pushed cache images (GHCR tags) so we can easily verify cache artifacts
      - name: List GHCR package versions (via GitHub API)
        shell: bash
        run: |
          set -eux
          echo "Listing GHCR package versions for archidep/app via GitHub API"
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/orgs/ArchiDep/packages/container/app/versions" | python -m json.tool || true

  # The whole of what this repository is allowed to do to the production server.
  # The key it authenticates with is locked to one command there, which takes
  # the digest below and nothing else: the image comes from the registry, the
  # configuration is the server's own, and the server verifies that this digest
  # really was built by this workflow before it runs it.
  deploy:
    if: github.repository == 'ArchiDep/website' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    permissions: {}
    timeout-minutes: 20
    steps:
      - name: Deploy the published image
        env:
          APP_DIGEST: ${{ needs.publish.outputs.app_digest }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$APP_DIGEST" ]; then
            echo "The publish job did not report the image digest" >&2
            exit 1
          fi

          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy"
          # The server's host key, pinned. Without it the first connection would
          # be to whoever answers on that address.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts_deploy"
          chmod 600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts_deploy"

          ssh \
            -i "$HOME/.ssh/id_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_deploy" \
            -o ConnectTimeout=30 \
            -p "$DEPLOY_PORT" \
            "archidep-deploy@$DEPLOY_HOST" \
            "deploy $APP_DIGEST"
