# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: build

on:
  push:
    branches:
      - '**'
  schedule:
    # Minute (0-59), Hour (0-23), Day of the month (1-31), Month of the Year (1-12), Day of the week (0-6, 0 = Sunday)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-24.04
    name: Build app
    needs: [build-assets, build-theme]
    env:
      ARCHIDEP_REPO_URL: ecto://archidep:archidep@127.0.0.1:5432/archidep
      ARCHIDEP_AUTH_SWITCH_EDU_ID_CLIENT_ID: id
      ARCHIDEP_AUTH_SWITCH_EDU_ID_CLIENT_SECRET: secret
      ARCHIDEP_WEB_ENDPOINT_LIVE_VIEW_SIGNING_SALT: U1IE4sj1tN+RjK239nUCtj1kCPZwFW/nJSNlrx6DwSV9jut1q8yPPfxaZPc7aNnV
      ARCHIDEP_WEB_ENDPOINT_SECRET_KEY_BASE: YdxkmjX6DMzwlOXvzoDpz+F3rPskbgjghvFn21sBeXlZt8sWRWm7nIRq7Mhg+tmF
      ARCHIDEP_WEB_ENDPOINT_SESSION_SIGNING_SALT: gpWUEtqY2/8uMQq33419KZQmu1iAnZgKIaMEIQl9TIgmyknRYhFyXwEiuc2tJucb
      ELIXIR_VERSION: 1.19.5
      ERLANG_VERSION: 28.5.0.1
      MIX_ENV: test
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: archidep
          POSTGRES_PASSWORD: archidep
          POSTGRES_USER: archidep
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - '5432:5432'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Cache app build
        uses: actions/cache@v3
        with:
          path: |
            app/deps
            app/_build
          key: ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-

      - name: Download course assets
        uses: actions/download-artifact@v4
        with:
          name: course_assets
          path: app/priv/static/assets/course

      - name: Download theme
        uses: actions/download-artifact@v4
        with:
          name: theme
          path: app/priv/static/assets

      - name: Install Erlang/OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install dependencies
        run: mix deps.get
        working-directory: app

      - name: Compile the app
        run: mix compile
        working-directory: app

      - name: Download user agent database
        run: mix ua_inspector.download --force
        working-directory: app

      - name: Fix test private key permissions
        run: chmod 600 test/priv/ssh/id_ed25519
        working-directory: app

      - name: Migrate the database
        run: mix ecto.migrate
        working-directory: app

      - name: Build assets
        run: mix assets.deploy
        working-directory: app

      - name: Run automated tests & measure code coverage
        run: mix coveralls.html --raise --repeat-until-failure 3
        working-directory: app

      # Install the pinned Ansible the compatibility smoke test drives, from the
      # same requirements files the production image will consume, so the test
      # certifies the version we ship rather than whatever is latest.
      - name: Install pinned Ansible for external-tool compatibility tests
        run: |
          python3 -m pip install --user --break-system-packages -r requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" ansible-galaxy collection install -r requirements.yml

      # Compatibility smoke tests (tagged `:external`) drive the real external
      # tools instead of their mocks. They are excluded from the default run and
      # from the coverage numbers, so they run as a separate step here — sharing
      # this job's compiled app rather than recompiling it (which would require
      # rebuilding the course) in a job of their own.
      - name: Run external-tool compatibility smoke tests
        run: mix test --only external
        working-directory: app

      - name: Perform static code analysis with Credo
        run: mix credo --strict
        working-directory: app

      - name: Perform static code analysis with Dialyzer
        run: mix dialyzer
        working-directory: app

      - name: Check code formatting
        run: mix format --check-formatted
        working-directory: app

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused
        working-directory: app

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  build-assets:
    runs-on: ubuntu-24.04
    name: Build course assets
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Build course assets
        run: npm run build
        working-directory: course

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload course assets
        uses: actions/upload-artifact@v4
        with:
          name: course_assets
          path: app/priv/static/assets/course
          retention-days: 5

  build-site:
    runs-on: ubuntu-24.04
    name: Build course material site
    env:
      ELIXIR_VERSION: 1.19.5
      ERLANG_VERSION: 28.5.0.1
      MIX_ENV: prod
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run --workspace course format

      # Built here rather than downloaded from the jobs beside this one: their
      # theme artifact carries `assets/theme` and not `assets/emoji`, which
      # every page of this renderer needs.
      - name: Build the theme
        run: npm run build
        working-directory: theme

      - name: Build course assets
        run: npm run build
        working-directory: course
        env:
          NODE_ENV: production

      # Where a build publishes its assets is not known when they are bundled:
      # the same bundle is served under an edition prefix, under a mount point,
      # and from the root of an export. A prefix baked in here would 404 in all
      # but one of those, taking with it the diagrams and the fonts.
      #
      # What is matched is the message webpack's automatic-publicPath runtime
      # throws where it cannot work out its own address, present only in a
      # bundle that has that runtime rather than a prefix. It is matched instead
      # of the assignment it guards because a string literal is the part of that
      # runtime a minified build keeps: the names around it, webpack's own
      # included, are gone by then.
      #
      # Checked here, where a production build of the assets happens on every
      # push, and again in the `pdf` workflow, which builds them itself and
      # cannot depend on this job having run.
      - name: Check the assets address themselves relatively
        run: grep -qF 'Automatic publicPath is not supported in this browser' app/priv/static/assets/course/slides-mermaid.js

      - name: Install Erlang/OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Keyed by environment as well, the build directory holding one of them, so
      # that this does not share a key with the test build of the app job.
      - name: Cache app build
        uses: actions/cache@v3
        with:
          path: |
            app/deps
            app/_build
          key: ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get
        working-directory: app

      - name: Compile the app
        run: mix compile
        working-directory: app

      - name: Digest the assets
        run: mix assets.deploy
        working-directory: app

      # Read rather than written, for the reason the PDF workflow gives: the
      # edition rendered and the directory it is published as are one fact.
      - name: Read the edition being published
        id: edition
        working-directory: app
        run: |
          year="$(mix archidep.course_site.edition | tail -n 1)"
          test -n "$year"
          echo "Building the $year edition"
          echo "year=$year" >> "$GITHUB_OUTPUT"

      # The backup copy: served at a root of its own, with content links left
      # local so that the copy standing in for a site that is down does not send
      # its reader back to it. It reaches the live site only through the banner
      # and the canonical link, which is what `--live-site-url` is for.
      - name: Build the site
        run: mix archidep.course_site.build --output ../tmp/site --clean --mode backup --live-site-url https://archidep.ch --no-source-maps
        working-directory: app

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # The archive repository is the backup site: publishing is a push into the
      # tree GitHub Pages serves, rather than an artifact upload that keeps
      # nothing between deployments. It holds the finished editions too, which
      # is what the two syncs below are about — the build owns its own edition
      # and the mount point, and must not touch a year it did not render.
      #
      # Nothing is published until the repository is named, so every step above
      # runs on a fork and on a branch while this one waits.
      - name: Publish the backup site
        if: github.ref == 'refs/heads/main' && vars.ARCHIDEP_ARCHIVE_REPO != ''
        env:
          ARCHIVE_REPO: ${{ vars.ARCHIDEP_ARCHIVE_REPO }}
          ARCHIVE_TOKEN: ${{ secrets.ARCHIDEP_ARCHIVE_TOKEN }}
          YEAR: ${{ steps.edition.outputs.year }}
        run: |
          set -euo pipefail

          git clone --depth 1 "https://x-access-token:$ARCHIVE_TOKEN@github.com/$ARCHIVE_REPO.git" tmp/archive

          # This edition's directory is replaced whole, so that a page dropped
          # since the last push stops being served.
          rsync -a --checksum --delete "tmp/site/$YEAR/" "tmp/archive/$YEAR/"

          # The mount point is this edition's as well, but it is shared: the
          # archived years are excluded so that they are neither copied over nor
          # deleted as strays, and so are the files that belong to the
          # repository rather than to any build. `.git` above all — a `--delete`
          # that reached it would take the history with it.
          rsync -a --checksum --delete \
            --exclude '/20[0-9][0-9]/' \
            --exclude '/.git/' \
            --exclude '/CNAME' \
            --exclude '/.nojekyll' \
            --exclude '/README.md' \
            tmp/site/ tmp/archive/

          cd tmp/archive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all

          # A run that rendered the same bytes as the last one leaves no commit
          # behind, the history of this repository being a history of the site
          # rather than of the pushes that produced it.
          if git diff --cached --quiet; then
            echo "The published site is already up to date"
          else
            git commit --message "Publish the $YEAR edition from $GITHUB_SHA"
            git push
          fi

  build-theme:
    runs-on: ubuntu-24.04
    name: Build theme
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Build the theme
        run: npm run build
        working-directory: theme

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # The fonts travel with the stylesheets naming them, which address them
      # relative to themselves: a copy of one without the other is a site set in
      # whatever the browser falls back to.
      - name: Upload theme
        uses: actions/upload-artifact@v4
        with:
          name: theme
          path: |
            app/priv/static/assets/fonts
            app/priv/static/assets/theme
          retention-days: 5

  format:
    runs-on: ubuntu-24.04
    name: Check formatting
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:root

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  lint:
    runs-on: ubuntu-24.04
    name: Lint Markdown
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check Markdown tables of contents are up to date
        run: npm run doctoc

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
