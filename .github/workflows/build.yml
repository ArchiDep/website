# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: build

on:
  push:
    branches:
      - '**'
  schedule:
    # Minute (0-59), Hour (0-23), Day of the month (1-31), Month of the Year (1-12), Day of the week (0-6, 0 = Sunday)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-24.04
    name: Build app
    needs: [build-assets, build-theme]
    env:
      ARCHIDEP_REPO_URL: ecto://archidep:archidep@127.0.0.1:5432/archidep
      ARCHIDEP_AUTH_SWITCH_EDU_ID_CLIENT_ID: id
      ARCHIDEP_AUTH_SWITCH_EDU_ID_CLIENT_SECRET: secret
      ARCHIDEP_WEB_ENDPOINT_LIVE_VIEW_SIGNING_SALT: U1IE4sj1tN+RjK239nUCtj1kCPZwFW/nJSNlrx6DwSV9jut1q8yPPfxaZPc7aNnV
      ARCHIDEP_WEB_ENDPOINT_SECRET_KEY_BASE: YdxkmjX6DMzwlOXvzoDpz+F3rPskbgjghvFn21sBeXlZt8sWRWm7nIRq7Mhg+tmF
      ARCHIDEP_WEB_ENDPOINT_SESSION_SIGNING_SALT: gpWUEtqY2/8uMQq33419KZQmu1iAnZgKIaMEIQl9TIgmyknRYhFyXwEiuc2tJucb
      ELIXIR_VERSION: 1.19.5
      ERLANG_VERSION: 28.5.0.1
      MIX_ENV: test
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: archidep
          POSTGRES_PASSWORD: archidep
          POSTGRES_USER: archidep
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - '5432:5432'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Cache app build
        uses: actions/cache@v3
        with:
          path: |
            app/deps
            app/_build
          key: ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-

      - name: Download course assets
        uses: actions/download-artifact@v4
        with:
          name: course_assets
          path: app/priv/static/assets/course

      - name: Download theme
        uses: actions/download-artifact@v4
        with:
          name: theme
          path: app/priv/static/assets

      - name: Install Erlang/OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install dependencies
        run: mix deps.get
        working-directory: app

      - name: Compile the app
        run: mix compile
        working-directory: app

      - name: Download user agent database
        run: mix ua_inspector.download --force
        working-directory: app

      - name: Fix test private key permissions
        run: chmod 600 test/priv/ssh/id_ed25519
        working-directory: app

      - name: Migrate the database
        run: mix ecto.migrate
        working-directory: app

      - name: Build assets
        run: mix assets.deploy
        working-directory: app

      - name: Run automated tests & measure code coverage
        run: mix coveralls.html --raise --repeat-until-failure 3
        working-directory: app

      # Install the pinned Ansible the compatibility smoke test drives, from the
      # same requirements files the production image will consume, so the test
      # certifies the version we ship rather than whatever is latest.
      - name: Install pinned Ansible for external-tool compatibility tests
        run: |
          python3 -m pip install --user --break-system-packages -r requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" ansible-galaxy collection install -r requirements.yml

      # Compatibility smoke tests (tagged `:external`) drive the real external
      # tools instead of their mocks. They are excluded from the default run and
      # from the coverage numbers, so they run as a separate step here — sharing
      # this job's compiled app rather than recompiling it (which would require
      # rebuilding the course) in a job of their own.
      - name: Run external-tool compatibility smoke tests
        run: mix test --only external
        working-directory: app

      - name: Perform static code analysis with Credo
        run: mix credo --strict
        working-directory: app

      - name: Perform static code analysis with Dialyzer
        run: mix dialyzer
        working-directory: app

      - name: Check code formatting
        run: mix format --check-formatted
        working-directory: app

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused
        working-directory: app

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  build-assets:
    runs-on: ubuntu-24.04
    name: Build course assets
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Build course assets
        run: npm run build
        working-directory: course

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload course assets
        uses: actions/upload-artifact@v4
        with:
          name: course_assets
          path: app/priv/static/assets/course
          retention-days: 5

  build-site:
    runs-on: ubuntu-24.04
    name: Build course material site
    env:
      # The runtime configuration is read whatever the command, so the build
      # task needs a value for everything it makes mandatory even though it
      # starts neither an endpoint nor a repository — the same list the PDF
      # workflow states, for the same reason.
      ARCHIDEP_REPO_URL: ecto://archidep:archidep@127.0.0.1:5432/archidep
      ARCHIDEP_SERVERS_API_BASE_URL: https://archidep.ch/api
      ARCHIDEP_AUTH_SWITCH_EDU_ID_CLIENT_ID: id
      ARCHIDEP_AUTH_SWITCH_EDU_ID_CLIENT_SECRET: secret
      ARCHIDEP_WEB_ENDPOINT_LIVE_VIEW_SIGNING_SALT: 5vur1eNR+LPxlMBG7Z8dgcipgv4N9+ADI2MzF/2jiFqNZUG2Ts/g4+hK1y5bAqOU9QT+9X2tU7lvwXz5
      ARCHIDEP_WEB_ENDPOINT_SECRET_KEY_BASE: 5JCHwFiOWjHyyGcp+dTHqYniYWdBvKvkT2CnwJwTBat9XlGRF1juYvGwEWGcKaXz/a61Hqn4bxHWAt+g
      ARCHIDEP_WEB_ENDPOINT_SESSION_SIGNING_SALT: WIrprzaArMvOUrkFjBi81OwfIGRIlzJXYISJycsk0qhKEELihlYp7i8QFj1Km+CmTwmroGsgS9byMgAw
      ELIXIR_VERSION: 1.19.5
      ERLANG_VERSION: 28.5.0.1
      # The environment the site ships in. Not `test`, whose configuration names
      # an edition of its own so that a test asserting a URL is asserting a fact
      # about the code.
      MIX_ENV: prod
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run --workspace course format

      # Built here rather than downloaded from the jobs beside this one: their
      # theme artifact carries `assets/theme` and not `assets/emoji`, which
      # every page of this renderer needs.
      - name: Build the theme
        run: npm run build
        working-directory: theme

      - name: Build course assets
        run: npm run build
        working-directory: course
        env:
          NODE_ENV: production

      - name: Install Erlang/OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Keyed by environment as well, the build directory holding one of them, so
      # that this does not share a key with the test build of the app job.
      - name: Cache app build
        uses: actions/cache@v3
        with:
          path: |
            app/deps
            app/_build
          key: ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-erlang-${{ env.ERLANG_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get
        working-directory: app

      - name: Compile the app
        run: mix compile
        working-directory: app

      - name: Digest the assets
        run: mix assets.deploy
        working-directory: app

      # The backup copy: served at a root of its own, with content links left
      # local so that the copy standing in for a site that is down does not send
      # its reader back to it. It reaches the live site only through the banner
      # and the canonical link, which is what `--live-site-url` is for.
      - name: Build the site
        run: mix archidep.course_site.build --output ../tmp/site --clean --mode backup --live-site-url https://archidep.ch
        working-directory: app

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  build-theme:
    runs-on: ubuntu-24.04
    name: Build theme
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Build the theme
        run: npm run build
        working-directory: theme

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # The fonts travel with the stylesheets naming them, which address them
      # relative to themselves: a copy of one without the other is a site set in
      # whatever the browser falls back to.
      - name: Upload theme
        uses: actions/upload-artifact@v4
        with:
          name: theme
          path: |
            app/priv/static/assets/fonts
            app/priv/static/assets/theme
          retention-days: 5

  format:
    runs-on: ubuntu-24.04
    name: Check formatting
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:root

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  lint:
    runs-on: ubuntu-24.04
    name: Lint Markdown
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24.4.0

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check Markdown tables of contents are up to date
        run: npm run doctoc

      - name: Ensure there are no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
